<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SynthV2 → NEUTRINO MusicXML Converter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 24px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    color: #a78bfa;
    margin-bottom: 24px;
    letter-spacing: 0.05em;
  }

  /* ── ドロップゾーン ── */
  #drop-zone {
    border: 2px dashed #4c4c7a;
    border-radius: 12px;
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 28px;
    background: #16213e;
  }
  #drop-zone.drag-over { border-color: #a78bfa; background: #1f1f4a; }
  #drop-zone p { color: #888; font-size: 0.95rem; }
  #drop-zone p span { color: #a78bfa; font-weight: 600; }
  #file-input { display: none; }

  /* ── セクションタイトル ── */
  .section-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* ── 拍子設定パネル ── */
  #meter-panel {
    background: #16213e;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 28px;
    display: none;
  }
  .meter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .meter-row label { font-size: 0.85rem; color: #aaa; white-space: nowrap; }
  .meter-row input {
    background: #0f3460;
    border: 1px solid #3a3a6a;
    color: #e0e0e0;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.9rem;
    width: 70px;
    text-align: center;
  }
  .meter-row input:focus { outline: none; border-color: #a78bfa; }
  .meter-row input.measure-input { width: 90px; }

  .btn-small {
    background: #2d2d5a;
    border: 1px solid #4c4c7a;
    color: #c0c0e0;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-small:hover { background: #3d3d7a; }

  .btn-del {
    background: none;
    border: none;
    color: #f87171;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    border-radius: 4px;
  }
  .btn-del:hover { background: #3a1a1a; }

  /* ── トラック一覧 ── */
  #track-panel {
    background: #16213e;
    border-radius: 10px;
    padding: 20px;
    display: none;
  }
  .track-card {
    background: #0f3460;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .track-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }
  .track-name {
    font-size: 0.95rem;
    font-weight: 600;
    color: #c4b5fd;
  }
  .track-stats {
    font-size: 0.78rem;
    color: #888;
    margin-bottom: 8px;
  }

  /* ── 歌詞プレビュー ── */
  .lyric-preview {
    font-size: 1rem;
    line-height: 2.2;
    word-break: break-all;
    background: #0a2040;
    border-radius: 6px;
    padding: 10px 14px;
    margin-top: 6px;
    min-height: 44px;
    position: relative;
  }

  /* 各ノートの歌詞セル */
  .lyric-cell {
    display: inline-block;
    position: relative;
    margin: 2px 1px;
    vertical-align: middle;
  }

  /* 歌詞文字スパン（クリックで編集） */
  .lyric-char {
    display: inline-block;
    min-width: 1.4em;
    text-align: center;
    border-radius: 4px;
    padding: 1px 3px;
    cursor: pointer;
    transition: background 0.1s, outline 0.1s;
    font-size: 1rem;
    line-height: 1.5;
    border: 1px solid transparent;
  }
  .lyric-char.ok {
    color: #86efac;
    border-color: transparent;
  }
  .lyric-char.ok:hover {
    background: #1a4030;
    border-color: #86efac44;
  }
  .lyric-char.err {
    color: #f87171;
    background: #3a0a0a;
    border-color: #f8717144;
  }
  .lyric-char.err:hover {
    background: #4a1010;
    border-color: #f87171aa;
  }
  .lyric-char.empty {
    color: #555;
    background: #2a1a1a;
    border-color: #f8717144;
    font-style: italic;
    font-size: 0.72rem;
    min-width: 2em;
  }
  .lyric-char.multi {
    color: #fbbf24;
    background: #2a1a00;
    border-color: #fbbf2444;
  }
  .lyric-char.multi:hover {
    background: #3a2a00;
  }

  /* ノート番号ツールチップ */
  .lyric-cell .note-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #ccc;
    font-size: 0.68rem;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 10;
  }
  .lyric-cell:hover .note-tip { display: block; }

  /* ── インライン編集ポップアップ ── */
  #edit-popup {
    display: none;
    position: fixed;
    background: #1e1e4a;
    border: 1px solid #a78bfa;
    border-radius: 10px;
    padding: 14px 16px;
    z-index: 1000;
    box-shadow: 0 8px 32px #0008;
    min-width: 200px;
  }
  #edit-popup .popup-label {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 6px;
  }
  #edit-popup .popup-label span {
    color: #c4b5fd;
    font-weight: 600;
  }
  #edit-input {
    width: 100%;
    background: #0f3460;
    border: 1px solid #a78bfa;
    color: #e0e0e0;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 1.1rem;
    text-align: center;
    outline: none;
    ime-mode: active;
  }
  #edit-input.input-err { border-color: #f87171; }
  #edit-popup .popup-hint {
    font-size: 0.72rem;
    color: #666;
    margin-top: 6px;
    text-align: center;
  }
  #edit-popup .popup-hint.hint-err { color: #f87171; }

  /* ── ボタン ── */
  .btn-dl {
    background: #7c3aed;
    border: none;
    color: #fff;
    border-radius: 7px;
    padding: 9px 18px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-dl:hover { background: #6d28d9; }

  /* エラーバナー */
  #error-banner {
    background: #3a0a0a;
    border: 1px solid #f87171;
    color: #f87171;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.88rem;
    display: none;
  }

  /* 警告バッジ */
  .warn-badge {
    display: inline-block;
    background: #7a1a1a;
    color: #f87171;
    font-size: 0.72rem;
    border-radius: 4px;
    padding: 1px 7px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .multi-badge {
    background: #3a2a00;
    color: #fbbf24;
  }

  .track-empty { color: #555; font-style: italic; font-size: 0.82rem; }

  /* 編集ヒント */
  .edit-hint {
    font-size: 0.74rem;
    color: #555;
    margin-top: 6px;
    text-align: right;
  }
</style>
</head>
<body>

<h1>SynthV2 → NEUTRINO MusicXML Converter</h1>

<div id="error-banner"></div>

<div id="drop-zone">
  <p>MIDIファイルを<span>ドラッグ＆ドロップ</span>、または<span style="cursor:pointer" onclick="document.getElementById('file-input').click()">クリックして選択</span></p>
  <p style="margin-top:8px;font-size:0.8rem;">SynthV2からエクスポートした .mid ファイル</p>
  <input type="file" id="file-input" accept=".mid,.midi">
</div>

<div id="meter-panel">
  <div class="section-title">拍子設定</div>
  <div id="meter-rows"></div>
  <button class="btn-small" id="add-meter-btn">＋ 拍子変更を追加</button>
</div>

<div id="track-panel">
  <div class="section-title">トラック一覧</div>
  <div id="track-list"></div>
</div>

<!-- インライン編集ポップアップ -->
<div id="edit-popup">
  <div class="popup-label" id="popup-label">ノート <span id="popup-note-info"></span></div>
  <input type="text" id="edit-input" maxlength="10" autocomplete="off" spellcheck="false">
  <div class="popup-hint" id="popup-hint">ひらがな1文字 or「ー」 / Enter で確定 / Esc でキャンセル</div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// MIDIパーサー（依存なし）
// ═══════════════════════════════════════════════════════
function parseMidi(buffer) {
  const data = new DataView(buffer);
  let pos = 0;

  const readUint32 = () => { const v = data.getUint32(pos); pos += 4; return v; };
  const readUint16 = () => { const v = data.getUint16(pos); pos += 2; return v; };
  const readUint8  = () => data.getUint8(pos++);
  const readBytes  = n => { const b = []; for (let i=0;i<n;i++) b.push(readUint8()); return b; };
  const readVarLen = () => {
    let val=0, b;
    do { b=readUint8(); val=(val<<7)|(b&0x7f); } while(b&0x80);
    return val;
  };
  const bytesToStr = bytes => {
    try { return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }
    catch(e) { return bytes.map(b=>String.fromCharCode(b)).join(''); }
  };

  readUint32(); // MThd
  readUint32(); // 6
  const format       = readUint16();
  const numTracks    = readUint16();
  const timeDivision = readUint16();
  const tracks = [];

  for (let t = 0; t < numTracks; t++) {
    readUint32(); // MTrk
    const chunkLen = readUint32();
    const chunkEnd = pos + chunkLen;
    const events   = [];
    let absTick    = 0;
    let running    = 0;

    while (pos < chunkEnd) {
      const delta = readVarLen();
      absTick += delta;
      let sb = data.getUint8(pos);
      if (sb & 0x80) { running = sb; pos++; } else { sb = running; }

      const eType = (sb >> 4) & 0x0f;
      const ch    = sb & 0x0f;

      if (sb === 0xff) {
        const mType = readUint8();
        const mLen  = readVarLen();
        const mData = readBytes(mLen);
        const ev    = { tick: absTick, type: 'meta', metaType: mType };
        if      (mType === 0x01) { ev.subtype='text';      ev.text=bytesToStr(mData); }
        else if (mType === 0x03) { ev.subtype='trackName'; ev.text=bytesToStr(mData); }
        else if (mType === 0x05) { ev.subtype='lyric';     ev.text=bytesToStr(mData); }
        else if (mType === 0x51) { ev.subtype='setTempo';  ev.microsecondsPerBeat=(mData[0]<<16)|(mData[1]<<8)|mData[2]; }
        else if (mType === 0x58) { ev.subtype='timeSignature'; ev.numerator=mData[0]; ev.denominator=Math.pow(2,mData[1]); }
        else if (mType === 0x2f) { ev.subtype='endOfTrack'; }
        else { ev.subtype='unknown'; }
        events.push(ev);
      } else if (sb===0xf0||sb===0xf7) {
        readBytes(readVarLen());
      } else {
        const d1 = readUint8();
        const ev = { tick: absTick, type:'channel', eventType:eType, channel:ch, d1 };
        if (eType!==0x0c && eType!==0x0d) ev.d2 = readUint8();
        if      (eType===0x09 && ev.d2>0) ev.subtype='noteOn';
        else if (eType===0x09)             ev.subtype='noteOff';
        else if (eType===0x08)             ev.subtype='noteOff';
        else                               ev.subtype='other';
        events.push(ev);
      }
    }
    pos = chunkEnd;
    tracks.push(events);
  }
  return { format, numTracks, timeDivision, tracks };
}

// ═══════════════════════════════════════════════════════
// バリデーション
// ═══════════════════════════════════════════════════════
// 1文字 & ひらがな(U+3041-U+309F) or 長音(U+30FC) → OK
function validateLyric(str) {
  if (!str || str.length === 0) return 'empty';
  if (str.length > 1)           return 'multi';
  if (/^[\u3041-\u309f\u30fc]$/.test(str)) return 'ok';
  return 'err';
}

// ═══════════════════════════════════════════════════════
// アプリ状態
// ═══════════════════════════════════════════════════════
let parsedTracks   = [];
let meterSettings  = [{ measure:1, beats:4, beatType:4 }];

// editState: 現在編集中のポップアップ情報
let editState = null; // { ti, ni, cellEl }

// ═══════════════════════════════════════════════════════
// ファイル読み込み
// ═══════════════════════════════════════════════════════
const dropZone  = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

function loadFile(file) {
  hideError();
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const midi = parseMidi(e.target.result);
      processMidi(midi);
    } catch(err) { showError('MIDIの解析に失敗しました: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function processMidi(midi) {
  const tpq = midi.timeDivision;
  parsedTracks = [];

  // テンポ取得
  let uspb = 500000;
  for (const track of midi.tracks) {
    for (const ev of track) {
      if (ev.subtype === 'setTempo') { uspb = ev.microsecondsPerBeat; break; }
    }
    break;
  }
  const bpm = Math.round(60000000 / uspb);

  for (let ti = 0; ti < midi.tracks.length; ti++) {
    const events = midi.tracks[ti];

    // トラック名
    let name = `Track ${ti + 1}`;
    for (const ev of events) {
      if (ev.subtype === 'trackName' && ev.text.trim()) { name = ev.text.trim(); break; }
    }

    // 歌詞キューを作成
    const lyricQueue = [];
    for (const ev of events) {
      if (ev.subtype === 'lyric' || ev.subtype === 'text') {
        lyricQueue.push({ tick: ev.tick, text: ev.text });
      }
    }
    let lyricIdx = 0;

    // ノートOn/Off対応
    const activeNotes = {};
    const notes = [];

    for (const ev of events) {
      if (ev.subtype === 'noteOn') {
        // このtick以下の最後のlyricを取る
        let lyric = '';
        while (lyricIdx < lyricQueue.length && lyricQueue[lyricIdx].tick <= ev.tick) {
          lyric = lyricQueue[lyricIdx].text;
          lyricIdx++;
        }
        activeNotes[ev.d1] = { startTick: ev.tick, lyric };
      } else if (ev.subtype === 'noteOff') {
        const on = activeNotes[ev.d1];
        if (on) {
          notes.push({
            pitch:     ev.d1,
            startTick: on.startTick,
            duration:  ev.tick - on.startTick,
            lyric:     on.lyric   // ← これがユーザー編集可能なフィールド
          });
          delete activeNotes[ev.d1];
        }
      }
    }

    if (notes.length === 0) continue;
    parsedTracks.push({ name, notes, bpm, tpq });
  }

  renderMeterPanel();
  renderTrackPanel();
}

// ═══════════════════════════════════════════════════════
// 拍子設定UI
// ═══════════════════════════════════════════════════════
function renderMeterPanel() {
  document.getElementById('meter-panel').style.display = 'block';
  renderMeterRows();
}

function renderMeterRows() {
  const container = document.getElementById('meter-rows');
  container.innerHTML = '';
  meterSettings.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'meter-row';
    row.innerHTML = `
      <label>小節</label>
      <input type="number" class="measure-input" value="${m.measure}" min="1"
        onchange="updateMeter(${i},'measure',this.value)">
      <label>拍子</label>
      <input type="number" value="${m.beats}" min="1" max="32"
        onchange="updateMeter(${i},'beats',this.value)">
      <label style="font-size:1rem;color:#666;">/</label>
      <input type="number" value="${m.beatType}" min="1"
        onchange="updateMeter(${i},'beatType',this.value)">
      ${i===0
        ? '<span style="font-size:0.78rem;color:#666;">（曲頭）</span>'
        : `<button class="btn-del" onclick="removeMeter(${i})">×</button>`}
    `;
    container.appendChild(row);
  });
}

function updateMeter(i, key, val) {
  meterSettings[i][key] = parseInt(val) || 1;
}
function removeMeter(i) {
  meterSettings.splice(i, 1);
  renderMeterRows();
}
document.getElementById('add-meter-btn').addEventListener('click', () => {
  const last = meterSettings[meterSettings.length - 1].measure;
  meterSettings.push({ measure: last + 4, beats: 4, beatType: 4 });
  renderMeterRows();
});

// ═══════════════════════════════════════════════════════
// トラック一覧UI
// ═══════════════════════════════════════════════════════
function renderTrackPanel() {
  document.getElementById('track-panel').style.display = 'block';
  const list = document.getElementById('track-list');
  list.innerHTML = '';

  if (parsedTracks.length === 0) {
    list.innerHTML = '<p class="track-empty">音符を含むトラックが見つかりませんでした</p>';
    return;
  }

  parsedTracks.forEach((track, ti) => {
    const card = document.createElement('div');
    card.className = 'track-card';
    card.dataset.ti = ti;

    // バッジ計算
    const errCount   = track.notes.filter(n => validateLyric(n.lyric) !== 'ok').length;
    const multiCount = track.notes.filter(n => validateLyric(n.lyric) === 'multi').length;

    let badges = '';
    if (multiCount > 0) badges += `<span class="warn-badge multi-badge">⚠ 複数文字 ${multiCount}件</span>`;
    if (errCount  > 0) badges += `<span class="warn-badge">⚠ エラー ${errCount}件</span>`;

    card.innerHTML = `
      <div class="track-header">
        <div>
          <span class="track-name">${escHtml(track.name)}</span>${badges}
        </div>
        <button class="btn-dl" onclick="downloadTrack(${ti})">↓ MusicXML DL</button>
      </div>
      <div class="track-stats">
        ノート数: ${track.notes.length} ／ BPM: ${track.bpm} ／ TPQ: ${track.tpq}
      </div>
      <div class="lyric-preview" id="lyric-preview-${ti}"></div>
      <div class="edit-hint">歌詞をクリックして編集 ／ 赤＝エラー ／ 黄＝複数文字</div>
    `;
    list.appendChild(card);
    renderLyricCells(ti);
  });
}

// 歌詞セルを描画（編集後の再描画も兼ねる）
function renderLyricCells(ti) {
  const track   = parsedTracks[ti];
  const preview = document.getElementById(`lyric-preview-${ti}`);
  if (!preview) return;
  preview.innerHTML = '';

  track.notes.forEach((note, ni) => {
    const status = validateLyric(note.lyric);
    const cell   = document.createElement('span');
    cell.className = 'lyric-cell';
    cell.dataset.ti = ti;
    cell.dataset.ni = ni;

    // ツールチップ
    const tip = document.createElement('span');
    tip.className = 'note-tip';
    const noteName = midiNoteToName(note.pitch);
    tip.textContent = `#${ni + 1} ${noteName}`;
    cell.appendChild(tip);

    // 文字スパン
    const charSpan = document.createElement('span');
    charSpan.className = 'lyric-char ' + status;

    if (status === 'empty') {
      charSpan.textContent = '空';
    } else if (status === 'multi') {
      // 複数文字は全部表示（黄色）
      charSpan.textContent = note.lyric;
    } else {
      charSpan.textContent = note.lyric;
    }

    charSpan.addEventListener('click', e => {
      e.stopPropagation();
      openEditPopup(ti, ni, cell, charSpan);
    });

    cell.appendChild(charSpan);
    preview.appendChild(cell);
  });

  // バッジ更新
  updateTrackBadges(ti);
}

// バッジのみ更新
function updateTrackBadges(ti) {
  const track    = parsedTracks[ti];
  const card     = document.querySelector(`.track-card[data-ti="${ti}"]`);
  if (!card) return;
  const nameEl   = card.querySelector('.track-name');
  const errCount   = track.notes.filter(n => validateLyric(n.lyric) !== 'ok').length;
  const multiCount = track.notes.filter(n => validateLyric(n.lyric) === 'multi').length;

  // 既存バッジを削除
  card.querySelectorAll('.warn-badge').forEach(b => b.remove());
  let badgesHtml = '';
  if (multiCount > 0) badgesHtml += `<span class="warn-badge multi-badge">⚠ 複数文字 ${multiCount}件</span>`;
  if (errCount  > 0)  badgesHtml += `<span class="warn-badge">⚠ エラー ${errCount}件</span>`;
  nameEl.insertAdjacentHTML('afterend', badgesHtml);
}

// ═══════════════════════════════════════════════════════
// インライン編集ポップアップ
// ═══════════════════════════════════════════════════════
const popup     = document.getElementById('edit-popup');
const editInput = document.getElementById('edit-input');
const popupHint = document.getElementById('popup-hint');

function openEditPopup(ti, ni, cellEl, charSpan) {
  // 既に開いてる場合は確定して閉じる
  if (editState) commitEdit();

  const note     = parsedTracks[ti].notes[ni];
  const noteName = midiNoteToName(note.pitch);

  editState = { ti, ni, cellEl, charSpan };

  // ポップアップ位置決め（セルの下）
  const rect = charSpan.getBoundingClientRect();
  popup.style.display = 'block';

  // 画面端チェック
  const pw = 210;
  let left = rect.left + window.scrollX;
  let top  = rect.bottom + window.scrollY + 6;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  popup.style.left = left + 'px';
  popup.style.top  = top  + 'px';

  // 初期値セット
  document.getElementById('popup-note-info').textContent = `#${ni + 1}（${noteName}）`;
  editInput.value = note.lyric === null || note.lyric === undefined ? '' : note.lyric;
  updateInputFeedback(editInput.value);
  editInput.focus();
  editInput.select();
}

function updateInputFeedback(val) {
  const status = validateLyric(val);
  editInput.className = status === 'ok' ? '' : 'input-err';
  if (status === 'ok') {
    popupHint.textContent = '✓ 有効な歌詞です';
    popupHint.className   = 'popup-hint';
  } else if (status === 'empty') {
    popupHint.textContent = '歌詞を入力してください（ひらがな1文字 or ー）';
    popupHint.className   = 'popup-hint hint-err';
  } else if (status === 'multi') {
    popupHint.textContent = `⚠ ${val.length}文字あります。1文字にしてください`;
    popupHint.className   = 'popup-hint hint-err';
  } else {
    popupHint.textContent = '⚠ ひらがな1文字 or「ー」のみ使用できます';
    popupHint.className   = 'popup-hint hint-err';
  }
}

editInput.addEventListener('input', () => {
  updateInputFeedback(editInput.value);
});

editInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    commitEdit();
    closePopup();
  } else if (e.key === 'Escape') {
    closePopup();
  } else if (e.key === 'Tab') {
    // Tabで次のノートへ
    e.preventDefault();
    const { ti, ni } = editState;
    commitEdit();
    closePopup();
    const track = parsedTracks[ti];
    const nextNi = e.shiftKey ? ni - 1 : ni + 1;
    if (nextNi >= 0 && nextNi < track.notes.length) {
      const nextCell    = document.querySelector(`.lyric-cell[data-ti="${ti}"][data-ni="${nextNi}"]`);
      const nextChar    = nextCell?.querySelector('.lyric-char');
      if (nextCell && nextChar) openEditPopup(ti, nextNi, nextCell, nextChar);
    }
  }
});

function commitEdit() {
  if (!editState) return;
  const { ti, ni } = editState;
  const newVal = editInput.value;
  // 空でもデータには保存（エラー表示のため）
  parsedTracks[ti].notes[ni].lyric = newVal;
  // セルを再描画
  renderLyricCells(ti);
  editState = null;
}

function closePopup() {
  popup.style.display = 'none';
  editState = null;
}

// ポップアップ外クリックで確定・閉じ
document.addEventListener('click', e => {
  if (editState && !popup.contains(e.target)) {
    commitEdit();
    closePopup();
  }
});

// ═══════════════════════════════════════════════════════
// MusicXML 生成
// ═══════════════════════════════════════════════════════
function buildMusicXML(track) {
  const { name, notes, bpm, tpq } = track;
  const divisions = 480;
  const meters = [...meterSettings].sort((a,b) => a.measure - b.measure);

  const tickToDivs = tick => Math.round(tick / tpq * divisions);

  function midiToPitch(midi) {
    const steps  = ['C','C','D','D','E','F','F','G','G','A','A','B'];
    const alters = [ 0,  1,  0,  1,  0,  0,  1,  0,  1,  0,  1,  0];
    const pc = midi % 12;
    return { step: steps[pc], alter: alters[pc], octave: Math.floor(midi/12)-1 };
  }

  function divsToType(divs) {
    const q = divisions;
    const table = [
      {d:q*4,type:'whole',dots:0},{d:q*3,type:'half',dots:1},
      {d:q*2,type:'half',dots:0},{d:q*1.5,type:'quarter',dots:1},
      {d:q,type:'quarter',dots:0},{d:q*0.75,type:'eighth',dots:1},
      {d:q*0.5,type:'eighth',dots:0},{d:q*0.25,type:'16th',dots:0},
      {d:q*0.125,type:'32nd',dots:0},
    ];
    let best=table[table.length-1], minDiff=Infinity;
    for (const row of table) {
      const diff=Math.abs(divs-row.d);
      if (diff<minDiff){minDiff=diff;best=row;}
    }
    return best;
  }

  const getMeterAt = mn => {
    let cur = meters[0];
    for (const m of meters) { if (m.measure <= mn) cur = m; }
    return cur;
  };
  const measureDivs = mn => {
    const m = getMeterAt(mn);
    return Math.round(divisions * 4 * m.beats / m.beatType);
  };

  const notesDivs = notes.map(n => ({
    start:    tickToDivs(n.startTick),
    duration: Math.max(1, tickToDivs(n.duration)),
    pitch:    n.pitch,
    lyric:    (n.lyric && n.lyric.trim()) ? n.lyric : 'ら'
  }));

  const noteXml = (pitch, dur, ti, lyric, tiedCont, tiedStart) => {
    let x = '      <note>\n';
    x += `        <pitch><step>${pitch.step}</step>`;
    if (pitch.alter !== 0) x += `<alter>${pitch.alter}</alter>`;
    x += `<octave>${pitch.octave}</octave></pitch>\n`;
    x += `        <duration>${dur}</duration>\n`;
    if (tiedCont)  x += '        <tie type="stop"/>\n';
    if (tiedStart) x += '        <tie type="start"/>\n';
    x += `        <type>${ti.type}</type>\n`;
    if (ti.dots > 0) x += '        <dot/>\n';
    if (!tiedCont) {
      x += `        <lyric number="1"><syllabic>single</syllabic><text>${escXml(lyric)}</text></lyric>\n`;
    }
    if (tiedCont || tiedStart) {
      x += '        <notations>';
      if (tiedCont)  x += '<tied type="stop"/>';
      if (tiedStart) x += '<tied type="start"/>';
      x += '</notations>\n';
    }
    x += '      </note>\n';
    return x;
  };

  const restXml = (dur, ti) =>
    `      <note><rest/><duration>${dur}</duration><type>${ti.type}</type></note>\n`;

  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
  xml += '<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" ';
  xml += '"http://www.musicxml.org/dtds/partwise.dtd">\n';
  xml += '<score-partwise version="3.1">\n';
  xml += '  <part-list>\n';
  xml += `    <score-part id="P1"><part-name>${escXml(name)}</part-name></score-part>\n`;
  xml += '  </part-list>\n';
  xml += '  <part id="P1">\n';

  let measureNum = 1, absPos = 0, noteIdx = 0;
  let prevMeter = null, pendingTie = null;

  while (noteIdx < notesDivs.length || pendingTie) {
    const mDivs     = measureDivs(measureNum);
    const mEnd      = absPos + mDivs;
    const curMeter  = getMeterAt(measureNum);
    const mChanged  = !prevMeter
      || prevMeter.beats !== curMeter.beats
      || prevMeter.beatType !== curMeter.beatType;

    xml += `    <measure number="${measureNum}">\n`;
    if (measureNum === 1 || mChanged) {
      xml += '      <attributes>\n';
      xml += `        <divisions>${divisions}</divisions>\n`;
      xml += `        <time><beats>${curMeter.beats}</beats><beat-type>${curMeter.beatType}</beat-type></time>\n`;
      xml += '      </attributes>\n';
      if (measureNum === 1) {
        xml += `      <direction placement="above"><direction-type><metronome>`;
        xml += `<beat-unit>quarter</beat-unit><per-minute>${bpm}</per-minute>`;
        xml += `</metronome></direction-type></direction>\n`;
      }
    }

    let cursor = absPos;

    if (pendingTie) {
      const remaining = pendingTie.absEnd - absPos;
      if (remaining > 0) {
        const segDur    = Math.min(remaining, mDivs);
        const isTiedEnd = pendingTie.absEnd > mEnd;
        xml += noteXml(midiToPitch(pendingTie.pitch), segDur, divsToType(segDur),
                       pendingTie.lyric, true, isTiedEnd);
        cursor += segDur;
        pendingTie = isTiedEnd ? pendingTie : null;
      } else {
        pendingTie = null;
      }
    }

    while (noteIdx < notesDivs.length) {
      const note = notesDivs[noteIdx];
      if (note.start >= mEnd) break;
      if (note.start > cursor) {
        const rd = Math.min(note.start, mEnd) - cursor;
        xml += restXml(rd, divsToType(rd));
        cursor += rd;
      }
      const noteEnd    = note.start + note.duration;
      const segDur     = Math.min(noteEnd, mEnd) - cursor;
      const isTieStart = noteEnd > mEnd;
      xml += noteXml(midiToPitch(note.pitch), segDur, divsToType(segDur),
                     note.lyric, false, isTieStart);
      cursor += segDur;
      if (isTieStart) {
        pendingTie = { pitch: note.pitch, lyric: note.lyric, absEnd: noteEnd };
        noteIdx++;
        break;
      }
      noteIdx++;
    }

    if (cursor < mEnd) {
      const rd = mEnd - cursor;
      xml += restXml(rd, divsToType(rd));
    }

    xml += '    </measure>\n';
    absPos = mEnd;
    prevMeter = curMeter;
    measureNum++;
    if (noteIdx >= notesDivs.length && !pendingTie) break;
  }

  xml += '  </part>\n</score-partwise>';
  return xml;
}

// ═══════════════════════════════════════════════════════
// ダウンロード
// ═══════════════════════════════════════════════════════
function downloadTrack(ti) {
  const track = parsedTracks[ti];
  const xml   = buildMusicXML(track);
  const blob  = new Blob([xml], { type: 'application/xml' });
  const url   = URL.createObjectURL(blob);
  const a     = document.createElement('a');
  a.href      = url;
  a.download  = `${track.name.replace(/[\\/:*?"<>|]/g,'_')}.musicxml`;
  a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════
// ユーティリティ
// ═══════════════════════════════════════════════════════
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiNoteToName(midi) {
  return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escXml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function showError(msg) {
  const b = document.getElementById('error-banner');
  b.textContent = msg; b.style.display = 'block';
}
function hideError() {
  document.getElementById('error-banner').style.display = 'none';
}
</script>
