<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SynthV2 → NEUTRINO MusicXML Converter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 24px;
  }

  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    color: #a78bfa;
    margin-bottom: 24px;
    letter-spacing: 0.05em;
  }

  /* ── ドロップゾーン ── */
  #drop-zone {
    border: 2px dashed #4c4c7a;
    border-radius: 12px;
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 28px;
    background: #16213e;
  }
  #drop-zone.drag-over { border-color: #a78bfa; background: #1f1f4a; }
  #drop-zone p { color: #888; font-size: 0.95rem; }
  #drop-zone p span { color: #a78bfa; font-weight: 600; }
  #file-input { display: none; }

  .section-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: #a78bfa;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* ── 拍子設定 ── */
  #meter-panel {
    background: #16213e;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 28px;
    display: none;
  }
  .meter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .meter-row label { font-size: 0.85rem; color: #aaa; white-space: nowrap; }
  .meter-row input {
    background: #0f3460;
    border: 1px solid #3a3a6a;
    color: #e0e0e0;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.9rem;
    width: 70px;
    text-align: center;
  }
  .meter-row input:focus { outline: none; border-color: #a78bfa; }
  .meter-row input.measure-input { width: 90px; }
  .btn-small {
    background: #2d2d5a;
    border: 1px solid #4c4c7a;
    color: #c0c0e0;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-small:hover { background: #3d3d7a; }
  .btn-del {
    background: none;
    border: none;
    color: #f87171;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .btn-del:hover { background: #3a1a1a; }

  /* ── トラック ── */
  #track-panel {
    background: #16213e;
    border-radius: 10px;
    padding: 20px;
    display: none;
  }
  .track-card {
    background: #0f3460;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .track-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
  }
  .track-name { font-size: 0.95rem; font-weight: 600; color: #c4b5fd; }
  .track-stats { font-size: 0.78rem; color: #888; margin-bottom: 10px; }

  /* ── 歌詞プレビュー ── */
  .lyric-preview {
    background: #0a2040;
    border-radius: 6px;
    padding: 10px 14px 10px 14px;
    overflow-x: auto;
    white-space: nowrap;
  }

  /* 小節ブロック：縦線＋番号＋ノート群をインラインで並べる */
  .measure-block {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    vertical-align: top;
    margin-right: 0;
  }

  /* 小節番号 */
  .measure-label {
    font-size: 0.6rem;
    color: #4a4a8a;
    padding-left: 5px;
    margin-bottom: 1px;
    user-select: none;
    line-height: 1;
  }

  /* ノート群 + 左縦線 */
  .measure-notes {
    display: inline-flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 1px;
    padding: 2px 8px 2px 5px;
    border-left: 1px solid #2a3a6a;
    min-height: 34px;
  }

  /* 各ノートセル */
  .lyric-cell {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    flex-shrink: 0;
  }

  /* ツールチップ */
  .note-tip {
    display: none;
    position: absolute;
    bottom: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: #222244;
    border: 1px solid #4a4a8a;
    color: #ccc;
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 20;
  }
  .lyric-cell:hover .note-tip { display: block; }

  /* 歌詞文字スパン */
  .lyric-char {
    display: inline-block;
    min-width: 1.5em;
    text-align: center;
    border-radius: 4px;
    padding: 2px 3px;
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1.5;
    border: 1px solid transparent;
    transition: background 0.1s;
    user-select: none;
  }
  .lyric-char.ok {
    color: #86efac;
  }
  .lyric-char.ok:hover { background: #1a4030; border-color: #86efac44; }

  .lyric-char.err {
    color: #f87171;
    background: #3a0a0a;
    border-color: #f8717155;
  }
  .lyric-char.err:hover { background: #4a1010; }

  .lyric-char.multi-ok {
    color: #6ee7b7;
    font-size: 0.82rem;
    min-width: 2em;
  }
  .lyric-char.multi-ok:hover { background: #1a3828; border-color: #6ee7b744; }

  .lyric-char.empty {
    color: #555;
    background: #2a1a1a;
    border-color: #f8717144;
    font-style: italic;
    font-size: 0.72rem;
    min-width: 2em;
  }

  .edit-hint {
    font-size: 0.72rem;
    color: #444;
    margin-top: 8px;
    text-align: right;
  }


  /* ── ボタン ── */
  .btn-dl {
    background: #7c3aed;
    border: none;
    color: #fff;
    border-radius: 7px;
    padding: 9px 18px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-dl:hover { background: #6d28d9; }

  /* バッジ */
  .warn-badge {
    display: inline-block;
    background: #7a1a1a;
    color: #f87171;
    font-size: 0.72rem;
    border-radius: 4px;
    padding: 1px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* エラーバナー */
  #error-banner {
    background: #3a0a0a;
    border: 1px solid #f87171;
    color: #f87171;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.88rem;
    display: none;
  }
  .track-empty { color: #555; font-style: italic; font-size: 0.82rem; }

  /* ── ポップアップ ── */
  #edit-popup {
    display: none;
    position: fixed;
    background: #1e1e4a;
    border: 1px solid #a78bfa;
    border-radius: 10px;
    padding: 14px 16px;
    z-index: 1000;
    box-shadow: 0 8px 32px #0008;
    min-width: 220px;
  }
  #edit-popup .popup-label { font-size: 0.75rem; color: #888; margin-bottom: 6px; }
  #edit-popup .popup-label span { color: #c4b5fd; font-weight: 600; }
  #edit-input {
    width: 100%;
    background: #0f3460;
    border: 1px solid #a78bfa;
    color: #e0e0e0;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 1.1rem;
    text-align: center;
    outline: none;
  }
  #edit-input.input-err { border-color: #f87171; }
  #edit-input.input-ok  { border-color: #86efac; }
  .popup-hint { font-size: 0.72rem; color: #666; margin-top: 6px; text-align: center; }
  .popup-hint.hint-err { color: #f87171; }
  .popup-hint.hint-ok  { color: #86efac; }
</style>
</head>
<body>

<h1>SynthV2 → NEUTRINO MusicXML Converter</h1>
<div id="error-banner"></div>

<div id="drop-zone">
  <p>MIDIファイルを<span>ドラッグ＆ドロップ</span>、または
     <span style="cursor:pointer" onclick="document.getElementById('file-input').click()">クリックして選択</span></p>
  <p style="margin-top:8px;font-size:0.8rem;">SynthV2からエクスポートした .mid ファイル</p>
  <input type="file" id="file-input" accept=".mid,.midi">
</div>

<div id="meter-panel">
  <div class="section-title">拍子設定</div>
  <div id="meter-rows"></div>
  <button class="btn-small" id="add-meter-btn">＋ 拍子変更を追加</button>
</div>

<div id="track-panel">
  <div class="section-title">トラック一覧</div>
  <div id="track-list"></div>
</div>

<div id="edit-popup">
  <div class="popup-label">ノート <span id="popup-note-info"></span></div>
  <input type="text" id="edit-input" maxlength="10" autocomplete="off" spellcheck="false">
  <div class="popup-hint" id="popup-hint"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// MIDIパーサー
// ═══════════════════════════════════════════════════════
function parseMidi(buffer) {
  const data = new DataView(buffer);
  let pos = 0;
  const ru32 = () => { const v=data.getUint32(pos); pos+=4; return v; };
  const ru16 = () => { const v=data.getUint16(pos); pos+=2; return v; };
  const ru8  = () => data.getUint8(pos++);
  const rbytes = n => { const b=[]; for(let i=0;i<n;i++) b.push(ru8()); return b; };
  const rvar = () => {
    let val=0,b; do{b=ru8();val=(val<<7)|(b&0x7f);}while(b&0x80); return val;
  };
  const b2s = bytes => {
    try { return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }
    catch(e) { return bytes.map(b=>String.fromCharCode(b)).join(''); }
  };

  ru32(); ru32(); // MThd + len
  const format=ru16(), numTracks=ru16(), tpq=ru16();
  const tracks=[];

  for(let t=0;t<numTracks;t++){
    ru32(); // MTrk
    const clen=ru32(), cend=pos+clen;
    const events=[]; let abs=0,run=0;
    while(pos<cend){
      abs+=rvar();
      let sb=data.getUint8(pos);
      if(sb&0x80){run=sb;pos++;}else{sb=run;}
      const et=(sb>>4)&0x0f, ch=sb&0x0f;
      if(sb===0xff){
        const mt=ru8(),ml=rvar(),md=rbytes(ml);
        const ev={tick:abs,type:'meta',metaType:mt};
        if(mt===0x01){ev.subtype='text';     ev.text=b2s(md);}
        else if(mt===0x03){ev.subtype='trackName';ev.text=b2s(md);}
        else if(mt===0x05){ev.subtype='lyric';    ev.text=b2s(md);}
        else if(mt===0x51){ev.subtype='setTempo'; ev.uspb=(md[0]<<16)|(md[1]<<8)|md[2];}
        else if(mt===0x58){ev.subtype='timeSig';  ev.num=md[0];ev.den=Math.pow(2,md[1]);}
        else if(mt===0x2f){ev.subtype='endOfTrack';}
        else{ev.subtype='unknown';}
        events.push(ev);
      }else if(sb===0xf0||sb===0xf7){
        rbytes(rvar());
      }else{
        const d1=ru8();
        const ev={tick:abs,type:'channel',eventType:et,channel:ch,d1};
        if(et!==0x0c&&et!==0x0d) ev.d2=ru8();
        if(et===0x09&&ev.d2>0) ev.subtype='noteOn';
        else if(et===0x09||et===0x08) ev.subtype='noteOff';
        else ev.subtype='other';
        events.push(ev);
      }
    }
    pos=cend; tracks.push(events);
  }
  return {format,numTracks,tpq,tracks};
}

// ═══════════════════════════════════════════════════════
// バリデーション
// ═══════════════════════════════════════════════════════
// ひらがな小文字（っ除く）
const SMALL_HIRA = /^[ぁぃぅぇぉゃゅょ]$/;
// ひらがな通常文字（小文字・っ含む全体）
const HIRA_ALL   = /^[\u3041-\u309f]$/;
// 長音
const CHOON      = /^\u30fc$/;

function validateLyric(str) {
  if (!str || str.length === 0) return 'empty';

  if (str.length === 1) {
    if (HIRA_ALL.test(str) || CHOON.test(str)) return 'ok';
    return 'err';
  }

  if (str.length === 2) {
    const c0 = str[0], c1 = str[1];
    // 通常ひらがな（っ以外）＋ 小文字ひらがな（っ除く）
    const c0ok = HIRA_ALL.test(c0) && !/^っ$/.test(c0);
    const c1ok = SMALL_HIRA.test(c1);
    if (c0ok && c1ok) return 'multi-ok';
    return 'multi-err';
  }

  return 'multi-err';
}

// ═══════════════════════════════════════════════════════
// 小節番号計算ユーティリティ
// ─────────────────────────────────────────────────────
// meters: [{measureNum, beats, beatType}, ...]（昇順ソート済み）
// tick から「何小節目か」「その小節の先頭tick」を返す
// ═══════════════════════════════════════════════════════
function buildMeasureMap(meters, tpq, totalTicks) {
  // measureMap: tick区間 → 小節番号
  // [{startTick, endTick, measureNum, beats, beatType}, ...]
  const sorted = [...meters].sort((a,b) => a.measureNum - b.measureNum);

  const map = [];
  let measureNum = 1;
  let curTick    = 0;
  let mi         = 0; // sortedsのインデックス

  // 最大小節数の上限（無限ループ防止）
  const maxMeasures = 2000;

  while (curTick < totalTicks + tpq * 8 && measureNum <= maxMeasures) {
    // 現在の拍子
    let beats = 4, beatType = 4;
    for (const m of sorted) {
      if (m.measureNum <= measureNum) { beats = m.beats; beatType = m.beatType; }
    }
    const mTicks = Math.round(tpq * 4 * beats / beatType);
    map.push({ startTick: curTick, endTick: curTick + mTicks, measureNum, beats, beatType });
    curTick += mTicks;
    measureNum++;
  }
  return map;
}

function getMeasureNumForTick(map, tick) {
  for (const m of map) {
    if (tick >= m.startTick && tick < m.endTick) return m.measureNum;
  }
  return map[map.length - 1].measureNum;
}

// ═══════════════════════════════════════════════════════
// アプリ状態
// ═══════════════════════════════════════════════════════
let parsedTracks  = [];
let meterSettings = [{ measureNum:1, beats:4, beatType:4 }];
let editState     = null;

// ═══════════════════════════════════════════════════════
// ファイル読み込み
// ═══════════════════════════════════════════════════════
const dropZone  = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('dragover', e=>{e.preventDefault();dropZone.classList.add('drag-over');});
dropZone.addEventListener('dragleave', ()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e=>{
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });

function loadFile(file) {
  hideError();
  const reader = new FileReader();
  reader.onload = e => {
    try { processMidi(parseMidi(e.target.result)); }
    catch(err) { showError('MIDIの解析に失敗しました: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function processMidi(midi) {
  const tpq = midi.tpq;
  parsedTracks = [];

  let uspb = 500000;
  for (const track of midi.tracks) {
    for (const ev of track) {
      if (ev.subtype === 'setTempo') { uspb = ev.uspb; break; }
    }
    break;
  }
  const bpm = Math.round(60000000 / uspb);

  for (let ti=0; ti<midi.tracks.length; ti++) {
    const events = midi.tracks[ti];
    let name = `Track ${ti+1}`;
    for (const ev of events) {
      if (ev.subtype==='trackName' && ev.text.trim()) { name=ev.text.trim(); break; }
    }

    const lyricQueue = [];
    for (const ev of events) {
      if (ev.subtype==='lyric'||ev.subtype==='text')
        lyricQueue.push({tick:ev.tick, text:ev.text});
    }
    let lyricIdx = 0;
    const active = {};
    const notes  = [];

    for (const ev of events) {
      if (ev.subtype==='noteOn') {
        let lyric='';
        while (lyricIdx<lyricQueue.length && lyricQueue[lyricIdx].tick<=ev.tick) {
          lyric=lyricQueue[lyricIdx].text; lyricIdx++;
        }
        active[ev.d1] = {startTick:ev.tick, lyric};
      } else if (ev.subtype==='noteOff') {
        const on = active[ev.d1];
        if (on) {
          notes.push({pitch:ev.d1, startTick:on.startTick,
                      duration:ev.tick-on.startTick, lyric:on.lyric});
          delete active[ev.d1];
        }
      }
    }
    if (notes.length===0) continue;
    parsedTracks.push({name, notes, bpm, tpq});
  }

  renderMeterPanel();
  renderTrackPanel();
}

// ═══════════════════════════════════════════════════════
// 拍子設定 UI
// ═══════════════════════════════════════════════════════
function renderMeterPanel() {
  document.getElementById('meter-panel').style.display='block';
  renderMeterRows();
}
function renderMeterRows() {
  const c = document.getElementById('meter-rows');
  c.innerHTML = '';
  meterSettings.forEach((m,i) => {
    const row = document.createElement('div');
    row.className = 'meter-row';
    row.innerHTML = `
      <label>小節</label>
      <input type="number" class="measure-input" value="${m.measureNum}" min="1"
        onchange="updateMeter(${i},'measureNum',this.value)">
      <label>拍子</label>
      <input type="number" value="${m.beats}" min="1" max="32"
        onchange="updateMeter(${i},'beats',this.value)">
      <label style="font-size:1rem;color:#666;">/</label>
      <input type="number" value="${m.beatType}" min="1"
        onchange="updateMeter(${i},'beatType',this.value)">
      ${i===0
        ? '<span style="font-size:0.78rem;color:#666;">（曲頭）</span>'
        : `<button class="btn-del" onclick="removeMeter(${i})">×</button>`}
    `;
    c.appendChild(row);
  });
}
function updateMeter(i, key, val) {
  meterSettings[i][key] = parseInt(val)||1;
  renderTrackPanel(); // 小節区切りに反映
}
function removeMeter(i) {
  meterSettings.splice(i,1);
  renderMeterRows();
  renderTrackPanel();
}
document.getElementById('add-meter-btn').addEventListener('click', ()=>{
  const last = meterSettings[meterSettings.length-1].measureNum;
  meterSettings.push({measureNum:last+4, beats:4, beatType:4});
  renderMeterRows();
});

// ═══════════════════════════════════════════════════════
// トラック一覧 UI
// ═══════════════════════════════════════════════════════
function renderTrackPanel() {
  document.getElementById('track-panel').style.display='block';
  const list = document.getElementById('track-list');
  list.innerHTML='';

  if (parsedTracks.length===0) {
    list.innerHTML='<p class="track-empty">音符を含むトラックが見つかりませんでした</p>';
    return;
  }
  parsedTracks.forEach((_,ti) => {
    const card = createTrackCard(ti);
    list.appendChild(card);
  });
}

function createTrackCard(ti) {
  const track = parsedTracks[ti];
  const errCount = track.notes.filter(n => {
    const s=validateLyric(n.lyric); return s!=='ok'&&s!=='multi-ok';
  }).length;

  const card = document.createElement('div');
  card.className='track-card';
  card.dataset.ti=ti;
  card.innerHTML=`
    <div class="track-header">
      <div>
        <span class="track-name">${escHtml(track.name)}</span>
        ${errCount>0?`<span class="warn-badge">⚠ エラー ${errCount}件</span>`:''}
      </div>
      <button class="btn-dl" onclick="downloadTrack(${ti})">↓ MusicXML DL</button>
    </div>
    <div class="track-stats">
      ノート数: ${track.notes.length} ／ BPM: ${track.bpm} ／ TPQ: ${track.tpq}
    </div>
    <div class="lyric-preview" id="lyric-preview-${ti}"></div>
    <div class="edit-hint">歌詞をクリックして編集 ／ Tab で次へ ／ Shift+Tab で前へ</div>
  `;
  // 歌詞セル描画
  setTimeout(()=>renderLyricCells(ti), 0);
  return card;
}

// ─────────────────────────────────────────────────────
// 歌詞セル描画（小節区切り付き）
// ─────────────────────────────────────────────────────
function renderLyricCells(ti) {
  const track   = parsedTracks[ti];
  const preview = document.getElementById(`lyric-preview-${ti}`);
  if (!preview) return;
  preview.innerHTML = '';

  // 小節マップ生成
  const totalTicks = track.notes.reduce(
    (mx, n) => Math.max(mx, n.startTick + n.duration), 0);
  const measureMap = buildMeasureMap(meterSettings, track.tpq, totalTicks);

  // ノートを小節ごとにグループ化
  const byMeasure = {};
  track.notes.forEach((note, ni) => {
    const mn = getMeasureNumForTick(measureMap, note.startTick);
    if (!byMeasure[mn]) byMeasure[mn] = [];
    byMeasure[mn].push(ni);
  });

  const measureNums = Object.keys(byMeasure).map(Number).sort((a, b) => a - b);

  measureNums.forEach(mn => {
    // 小節ブロック全体（番号＋縦線＋ノート群）
    const block = document.createElement('span');
    block.className = 'measure-block';

    // 小節番号
    const label = document.createElement('span');
    label.className  = 'measure-label';
    label.textContent = mn;
    block.appendChild(label);

    // ノード群（縦線はCSSのborder-leftで表現）
    const notesWrap = document.createElement('span');
    notesWrap.className = 'measure-notes';

    byMeasure[mn].forEach(ni => {
      notesWrap.appendChild(makeLyricCell(ti, ni));
    });

    block.appendChild(notesWrap);
    preview.appendChild(block);
  });

  updateTrackBadge(ti);
}


function makeLyricCell(ti, ni) {
  const note   = parsedTracks[ti].notes[ni];
  const status = validateLyric(note.lyric);

  const cell = document.createElement('span');
  cell.className = 'lyric-cell';
  cell.dataset.ti = ti;
  cell.dataset.ni = ni;

  // ツールチップ
  const tip = document.createElement('span');
  tip.className = 'note-tip';
  tip.textContent = `#${ni+1} ${midiNoteToName(note.pitch)}`;
  cell.appendChild(tip);

  // 歌詞スパン
  const span = document.createElement('span');
  span.className = 'lyric-char ' + (
    status==='ok'       ? 'ok'       :
    status==='multi-ok' ? 'multi-ok' :
    status==='empty'    ? 'empty'    : 'err'
  );
  span.textContent = status==='empty' ? '空' : (note.lyric||'');

  span.addEventListener('click', e => {
    e.stopPropagation();
    openEditPopup(ti, ni, cell, span);
  });

  cell.appendChild(span);
  return cell;
}

function updateTrackBadge(ti) {
  const track = parsedTracks[ti];
  const card  = document.querySelector(`.track-card[data-ti="${ti}"]`);
  if (!card) return;
  const nameEl   = card.querySelector('.track-name');
  const errCount = track.notes.filter(n=>{
    const s=validateLyric(n.lyric); return s!=='ok'&&s!=='multi-ok';
  }).length;
  card.querySelectorAll('.warn-badge').forEach(b=>b.remove());
  if (errCount>0)
    nameEl.insertAdjacentHTML('afterend',
      `<span class="warn-badge">⚠ エラー ${errCount}件</span>`);
}

// ═══════════════════════════════════════════════════════
// インライン編集ポップアップ
// ═══════════════════════════════════════════════════════
const popup     = document.getElementById('edit-popup');
const editInput = document.getElementById('edit-input');
const popupHint = document.getElementById('popup-hint');

function openEditPopup(ti, ni, cellEl, charSpan) {
  if (editState) commitEdit();

  const note = parsedTracks[ti].notes[ni];
  editState  = {ti, ni, cellEl, charSpan};

  const rect = charSpan.getBoundingClientRect();
  popup.style.display = 'block';
  let left = rect.left + window.scrollX;
  let top  = rect.bottom + window.scrollY + 6;
  if (left + 230 > window.innerWidth - 8) left = window.innerWidth - 238;
  popup.style.left = left + 'px';
  popup.style.top  = top  + 'px';

  document.getElementById('popup-note-info').textContent =
    `#${ni+1}（${midiNoteToName(note.pitch)}）`;
  editInput.value = note.lyric ?? '';
  updateInputFeedback(editInput.value);
  editInput.focus();
  editInput.select();
}

function updateInputFeedback(val) {
  const s = validateLyric(val);
  if (s==='ok'||s==='multi-ok') {
    editInput.className = 'input-ok';
    popupHint.textContent = '✓ 有効な歌詞です';
    popupHint.className = 'popup-hint hint-ok';
  } else if (s==='empty') {
    editInput.className = 'input-err';
    popupHint.textContent = 'ひらがな1文字 or「ー」を入力してください';
    popupHint.className = 'popup-hint hint-err';
  } else if (s==='multi-ok') {
    editInput.className = 'input-ok';
    popupHint.textContent = '✓ 拗音の組み合わせとして有効です';
    popupHint.className = 'popup-hint hint-ok';
  } else if (s==='multi-err') {
    editInput.className = 'input-err';
    popupHint.textContent = `⚠ ${val.length}文字。拗音以外の複数文字は使えません`;
    popupHint.className = 'popup-hint hint-err';
  } else {
    editInput.className = 'input-err';
    popupHint.textContent = '⚠ ひらがな・長音（ー）以外は使えません';
    popupHint.className = 'popup-hint hint-err';
  }
}

editInput.addEventListener('input', ()=>updateInputFeedback(editInput.value));

editInput.addEventListener('keydown', e=>{
  if (e.key==='Enter') {
    e.preventDefault();
    commitEdit(); closePopup();
  } else if (e.key==='Escape') {
    closePopup();
  } else if (e.key==='Tab') {
    e.preventDefault();
    const {ti,ni} = editState;
    commitEdit(); closePopup();
    const track  = parsedTracks[ti];
    const nextNi = e.shiftKey ? ni-1 : ni+1;
    if (nextNi>=0 && nextNi<track.notes.length) {
      const nextCell = document.querySelector(
        `.lyric-cell[data-ti="${ti}"][data-ni="${nextNi}"]`);
      const nextSpan = nextCell?.querySelector('.lyric-char');
      if (nextCell && nextSpan) openEditPopup(ti, nextNi, nextCell, nextSpan);
    }
  }
});

function commitEdit() {
  if (!editState) return;
  const {ti,ni} = editState;
  parsedTracks[ti].notes[ni].lyric = editInput.value;
  renderLyricCells(ti);
  editState = null;
}
function closePopup() {
  popup.style.display='none';
  editState=null;
}
document.addEventListener('click', e=>{
  if (editState && !popup.contains(e.target)) { commitEdit(); closePopup(); }
});

// ═══════════════════════════════════════════════════════
// MusicXML 生成
// ═══════════════════════════════════════════════════════
function buildMusicXML(track) {
  const {name,notes,bpm,tpq} = track;
  const divisions = 480;
  const meters    = [...meterSettings].sort((a,b)=>a.measureNum-b.measureNum);

  const t2d  = tick => Math.round(tick/tpq*divisions);
  const midi2pitch = midi => {
    const steps  = ['C','C','D','D','E','F','F','G','G','A','A','B'];
    const alters = [ 0,  1,  0,  1,  0,  0,  1,  0,  1,  0,  1,  0];
    const pc=midi%12;
    return {step:steps[pc],alter:alters[pc],octave:Math.floor(midi/12)-1};
  };
  const d2t = divs => {
    const q=divisions;
    const tbl=[
      {d:q*4,type:'whole',dots:0},{d:q*3,type:'half',dots:1},
      {d:q*2,type:'half',dots:0},{d:q*1.5,type:'quarter',dots:1},
      {d:q,type:'quarter',dots:0},{d:q*0.75,type:'eighth',dots:1},
      {d:q*0.5,type:'eighth',dots:0},{d:q*0.25,type:'16th',dots:0},
      {d:q*0.125,type:'32nd',dots:0},
    ];
    let best=tbl[tbl.length-1],min=Infinity;
    for(const r of tbl){const d=Math.abs(divs-r.d);if(d<min){min=d;best=r;}}
    return best;
  };
  const getMeterAt = mn => {
    let cur=meters[0];
    for(const m of meters){if(m.measureNum<=mn)cur=m;}
    return cur;
  };
  const mDivs = mn => {
    const m=getMeterAt(mn);
    return Math.round(divisions*4*m.beats/m.beatType);
  };

  const nd = notes.map(n=>({
    start:   t2d(n.startTick),
    dur:     Math.max(1,t2d(n.duration)),
    pitch:   n.pitch,
    lyric:   (n.lyric&&n.lyric.trim()) ? n.lyric : 'ら'
  }));

  const nxml = (p,dur,ti,lyric,tc,ts) => {
    let x=`      <note>\n`;
    x+=`        <pitch><step>${p.step}</step>`;
    if(p.alter!==0)x+=`<alter>${p.alter}</alter>`;
    x+=`<octave>${p.octave}</octave></pitch>\n`;
    x+=`        <duration>${dur}</duration>\n`;
    if(tc)x+=`        <tie type="stop"/>\n`;
    if(ts)x+=`        <tie type="start"/>\n`;
    x+=`        <type>${ti.type}</type>\n`;
    if(ti.dots>0)x+=`        <dot/>\n`;
    if(!tc){
      x+=`        <lyric number="1"><syllabic>single</syllabic>`;
      x+=`<text>${escXml(lyric)}</text></lyric>\n`;
    }
    if(tc||ts){
      x+=`        <notations>`;
      if(tc)x+=`<tied type="stop"/>`;
      if(ts)x+=`<tied type="start"/>`;
      x+=`</notations>\n`;
    }
    x+=`      </note>\n`; return x;
  };
  const rxml = (dur,ti) =>
    `      <note><rest/><duration>${dur}</duration><type>${ti.type}</type></note>\n`;

  let xml='<?xml version="1.0" encoding="UTF-8"?>\n';
  xml+='<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" ';
  xml+='"http://www.musicxml.org/dtds/partwise.dtd">\n';
  xml+='<score-partwise version="3.1">\n';
  xml+='  <part-list>\n';
  xml+=`    <score-part id="P1"><part-name>${escXml(name)}</part-name></score-part>\n`;
  xml+='  </part-list>\n  <part id="P1">\n';

  let mn=1,absPos=0,ni=0,prevM=null,pendTie=null;

  while(ni<nd.length||pendTie){
    const mdivs=mDivs(mn), mEnd=absPos+mdivs;
    const curM=getMeterAt(mn);
    const mchg=!prevM||prevM.beats!==curM.beats||prevM.beatType!==curM.beatType;

    xml+=`    <measure number="${mn}">\n`;
    if(mn===1||mchg){
      xml+=`      <attributes>\n`;
      xml+=`        <divisions>${divisions}</divisions>\n`;
      xml+=`        <time><beats>${curM.beats}</beats><beat-type>${curM.beatType}</beat-type></time>\n`;
      xml+=`      </attributes>\n`;
      if(mn===1){
        xml+=`      <direction placement="above"><direction-type>`;
        xml+=`<metronome><beat-unit>quarter</beat-unit><per-minute>${bpm}</per-minute></metronome>`;
        xml+=`</direction-type></direction>\n`;
      }
    }

    let cur=absPos;
    if(pendTie){
      const rem=pendTie.absEnd-absPos;
      if(rem>0){
        const seg=Math.min(rem,mdivs);
        const ite=pendTie.absEnd>mEnd;
        xml+=nxml(midi2pitch(pendTie.pitch),seg,d2t(seg),pendTie.lyric,true,ite);
        cur+=seg; if(!ite)pendTie=null;
      } else pendTie=null;
    }

    while(ni<nd.length){
      const note=nd[ni];
      if(note.start>=mEnd)break;
      if(note.start>cur){
        const rd=Math.min(note.start,mEnd)-cur;
        xml+=rxml(rd,d2t(rd)); cur+=rd;
      }
      const ne=note.start+note.dur;
      const seg=Math.min(ne,mEnd)-cur;
      const its=ne>mEnd;
      xml+=nxml(midi2pitch(note.pitch),seg,d2t(seg),note.lyric,false,its);
      cur+=seg;
      if(its){pendTie={pitch:note.pitch,lyric:note.lyric,absEnd:ne};ni++;break;}
      ni++;
    }

    if(cur<mEnd){const rd=mEnd-cur;xml+=rxml(rd,d2t(rd));}
    xml+=`    </measure>\n`;
    absPos=mEnd; prevM=curM; mn++;
    if(ni>=nd.length&&!pendTie)break;
  }

  xml+='  </part>\n</score-partwise>';
  return xml;
}

// ═══════════════════════════════════════════════════════
// ダウンロード
// ═══════════════════════════════════════════════════════
function downloadTrack(ti) {
  const track=parsedTracks[ti];
  const xml=buildMusicXML(track);
  const blob=new Blob([xml],{type:'application/xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`${track.name.replace(/[\\/:*?"<>|]/g,'_')}.musicxml`;
  a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════
// ユーティリティ
// ═══════════════════════════════════════════════════════
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const midiNoteToName = midi =>
  NOTE_NAMES[midi%12] + (Math.floor(midi/12)-1);

const escHtml = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const escXml = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
const showError = msg => {
  const b=document.getElementById('error-banner');
  b.textContent=msg; b.style.display='block';
};
const hideError = () =>
  document.getElementById('error-banner').style.display='none';
</script>
