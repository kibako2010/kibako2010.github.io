<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FreePad</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#1c1c1e;color:#fff;
  overflow:hidden;height:100dvh;width:100dvw;
  touch-action:none;user-select:none;
}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.screen.hidden{display:none}

#setupScreen{background:#1c1c1e;align-items:center;justify-content:center}
.setup-card{
  background:#2c2c2e;border-radius:20px;padding:36px 32px;
  width:min(480px,92vw);display:flex;flex-direction:column;gap:18px
}
.setup-card h2{
  font-size:24px;font-weight:700;
  background:linear-gradient(135deg,#a78bfa,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.setup-card p{font-size:13px;color:#8e8e93;line-height:1.6}
.setup-card label{font-size:13px;color:#aeaeb2;font-weight:600;display:block;margin-bottom:4px}
.setup-input{
  width:100%;padding:11px 14px;
  background:#1c1c1e;border:1.5px solid #3a3a3c;
  border-radius:10px;color:#fff;font-size:15px;outline:none;transition:border-color .2s;
  touch-action:auto;user-select:text
}
.setup-input:focus{border-color:#7c3aed}
.setup-input::placeholder{color:#636366}
.btn-primary{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  color:#fff;border:none;border-radius:12px;
  padding:13px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .15s
}
.btn-primary:active{opacity:.85}
.setup-error{color:#ff453a;font-size:13px;display:none;padding:8px 12px;background:rgba(255,69,58,.1);border-radius:8px}
.url-box{
  background:#1c1c1e;border:1.5px solid #3a3a3c;border-radius:10px;
  padding:10px 14px;font-size:12px;color:#8e8e93;
  word-break:break-all;line-height:1.6;display:none
}
.url-box strong{color:#a78bfa;display:block;margin-bottom:4px}
.btn-copy{
  background:#3a3a3c;color:#fff;border:none;border-radius:8px;
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  align-self:flex-start;display:none
}
.step-badge{
  background:rgba(124,58,237,.15);color:#a78bfa;
  border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-right:6px
}

.home-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;background:#2c2c2e;border-bottom:1px solid #3a3a3c;
  flex-shrink:0
}
.home-header h1{
  font-size:26px;font-weight:700;
  background:linear-gradient(135deg,#a78bfa,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.header-actions{display:flex;gap:8px;align-items:center}
.btn-new{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  color:#fff;border:none;border-radius:20px;
  padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer
}
.btn-settings{
  background:#3a3a3c;border:none;border-radius:50%;
  width:36px;height:36px;cursor:pointer;color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center
}
.boards-grid{
  flex:1;overflow-y:auto;padding:16px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:14px;align-content:start;
  touch-action:pan-y
}
.board-card{
  background:#2c2c2e;border-radius:16px;overflow:hidden;
  cursor:pointer;transition:transform .2s,box-shadow .2s;
  border:2px solid transparent;position:relative
}
.board-card:hover,.board-card:active{
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(124,58,237,.35);border-color:#7c3aed
}
.board-thumb{width:100%;aspect-ratio:4/3;background:#f5f4ef;display:block}
.board-info{padding:10px 12px}
.board-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f2f2f7}
.board-date{font-size:11px;color:#8e8e93;margin-top:2px}
.board-del{
  position:absolute;top:6px;right:6px;
  background:rgba(255,59,48,.9);border:none;border-radius:50%;
  width:28px;height:28px;color:#fff;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s
}
.board-card:hover .board-del{opacity:1}
.board-del:active{opacity:1}
.sync-status{font-size:12px;color:#8e8e93;display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#34c759}
.sync-dot.loading{background:#ff9500;animation:pulse 1s infinite}
.sync-dot.error{background:#ff453a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:#8e8e93}

#editorScreen{background:#f5f4ef}
.toolbar{
  display:flex;align-items:center;gap:4px;padding:8px 10px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid #e0e0e0;
  flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  z-index:100;flex-shrink:0;
  touch-action:pan-x
}
.toolbar::-webkit-scrollbar{display:none}
.tb-group{display:flex;gap:2px;align-items:center;flex-shrink:0}
.tb-sep{width:1px;height:28px;background:#d1d1d6;margin:0 4px;flex-shrink:0}
.tb-btn{
  border:none;background:transparent;border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;transition:background .12s;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;color:#1c1c1e;
  touch-action:manipulation
}
.tb-btn:hover{background:#f0f0f0}
.tb-btn:active{background:#e8e8e8}
.tb-btn.active{background:#ede9fe;color:#7c3aed}
.tb-btn.danger{color:#636366}
.tb-btn.danger:active{background:#ffe4e4}
/* 選択中は赤く目立たせる */
.tb-btn.danger.has-selection{
  color:#ff3b30;
  background:#fff0f0
}
.tb-back{
  font-size:13px;font-weight:600;color:#7c3aed;
  background:none;border:none;cursor:pointer;
  padding:6px 10px;border-radius:8px;white-space:nowrap;flex-shrink:0;
  touch-action:manipulation
}
.tb-back:hover{background:#ede9fe}
.board-title-input{
  flex:1;min-width:80px;border:none;background:transparent;
  font-size:16px;font-weight:600;color:#1c1c1e;text-align:center;outline:none;
  touch-action:auto;user-select:text
}
.color-dots{display:flex;gap:5px;align-items:center}
.color-dot{
  width:22px;height:22px;border-radius:50%;
  border:3px solid transparent;cursor:pointer;transition:transform .12s;flex-shrink:0;
  touch-action:manipulation
}
.color-dot:hover,.color-dot.active{transform:scale(1.2);border-color:#333}
.stroke-slider{width:70px;accent-color:#7c3aed;flex-shrink:0;touch-action:none}

.canvas-wrap{flex:1;position:relative;overflow:hidden;background:#f5f4ef}

#mainCanvas{
  position:absolute;top:0;left:0;
  touch-action:none;
  cursor:crosshair
}
#mainCanvas.select-mode{cursor:default}

.shape-popup{
  position:absolute;top:54px;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  padding:10px;display:flex;gap:8px;z-index:200;border:1px solid #e0e0e0
}
.shape-popup.hidden{display:none}
.shape-opt{
  width:44px;height:44px;border:2px solid #e0e0e0;
  border-radius:10px;background:#f9f9f9;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent
}
.shape-opt:active{background:#ede9fe;border-color:#7c3aed}

.text-style-panel{
  position:absolute;top:54px;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  padding:14px 16px;z-index:200;border:1px solid #e0e0e0;
  display:flex;flex-direction:column;gap:12px;
  min-width:300px;max-width:92vw;
  touch-action:auto
}
.text-style-panel.hidden{display:none}
.tsp-row{display:flex;align-items:center;gap:10px}
.tsp-label{font-size:12px;color:#636366;width:68px;flex-shrink:0}
.tsp-colors{display:flex;gap:4px;flex-wrap:wrap}
.tsp-dot{
  width:22px;height:22px;border-radius:50%;
  border:3px solid transparent;cursor:pointer;transition:transform .12s;flex-shrink:0;
  touch-action:manipulation
}
.tsp-dot:hover,.tsp-dot.active{transform:scale(1.2);border-color:#333}
.tsp-slider{flex:1;accent-color:#7c3aed;touch-action:none}
.tsp-val{font-size:12px;color:#636366;width:38px;text-align:right;flex-shrink:0}
.tsp-select{
  flex:1;padding:5px 8px;border-radius:8px;
  border:1.5px solid #d1d1d6;font-size:13px;
  outline:none;color:#1c1c1e;background:#fff;touch-action:auto
}
.tsp-close{
  align-self:flex-end;background:none;border:none;
  color:#7c3aed;font-size:13px;font-weight:600;cursor:pointer;
  padding:4px 10px;border-radius:6px;touch-action:manipulation
}
.tsp-close:hover{background:#ede9fe}

.sel-box{
  position:absolute;pointer-events:none;z-index:20;
  border:2px solid #2563eb;border-radius:3px;
  box-sizing:border-box
}
.sel-handle{
  position:absolute;width:20px;height:20px;
  background:#fff;border:2.5px solid #2563eb;border-radius:5px;
  pointer-events:all;z-index:21;
  transform:translate(-50%,-50%);
  touch-action:none;cursor:pointer
}

.float-textarea{
  position:absolute;z-index:50;
  resize:none;outline:none;border:none;overflow:hidden;
  background:transparent;line-height:1.5;padding:6px 10px;
  border-radius:8px;
  /* 透明度を0.01にして視覚的に非表示だがフォーカスは受け取る */
  opacity:0.01;
  touch-action:auto;user-select:text;
  -webkit-user-select:text
}

.mode-badge{
  position:absolute;bottom:14px;right:14px;
  background:rgba(0,0,0,.55);color:#fff;
  padding:5px 12px;border-radius:12px;
  font-size:12px;font-weight:600;pointer-events:none;z-index:50
}

.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(80px);
  padding:10px 24px;border-radius:20px;
  font-size:14px;font-weight:600;
  transition:transform .3s ease;z-index:9999;
  pointer-events:none;white-space:nowrap
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:rgba(52,199,89,.95);color:#fff}
.toast.error{background:rgba(255,69,58,.95);color:#fff}
.toast.info{background:rgba(0,122,255,.95);color:#fff}

.loading-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;backdrop-filter:blur(4px)
}
.loading-overlay.hidden{display:none}
.loading-spinner{
  width:48px;height:48px;
  border:4px solid rgba(255,255,255,.2);
  border-top-color:#a78bfa;border-radius:50%;
  animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ===== SETUP ===== -->
<div id="setupScreen" class="screen hidden">
  <div class="setup-card">
    <h2>✦ FreePad 初期設定</h2>
    <p>設定完了後に表示される<strong style="color:#a78bfa">ブックマーク用URL</strong>をEdgeに登録してください。次回からは設定画面なしで直接起動します。</p>
    <div>
      <label><span class="step-badge">1</span>GitHubユーザー名</label>
      <input class="setup-input" id="cfgOwner" placeholder="例: your-username" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none">
    </div>
    <div>
      <label><span class="step-badge">2</span>データ用リポジトリ名</label>
      <input class="setup-input" id="cfgRepo" placeholder="例: freepad-data" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="none">
    </div>
    <div>
      <label><span class="step-badge">3</span>Personal Access Token（Contents: Read &amp; Write）</label>
      <input class="setup-input" id="cfgToken" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
    </div>
    <div class="setup-error" id="setupError"></div>
    <button class="btn-primary" onclick="setupSave()">接続して確認 →</button>
    <div class="url-box" id="urlBox">
      <strong>📌 このURLをブックマーク登録してください</strong>
      <span id="urlText"></span>
    </div>
    <button class="btn-copy" id="btnCopy" onclick="copyUrl()">📋 URLをコピー</button>
    <button class="btn-primary" id="btnGo" style="display:none" onclick="goToApp()">アプリを開く →</button>
  </div>
</div>

<!-- ===== HOME ===== -->
<div id="homeScreen" class="screen hidden">
  <div class="home-header">
    <h1>✦ FreePad</h1>
    <div class="header-actions">
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">同期済み</span>
      </div>
      <button class="btn-settings" onclick="showSetup()" title="設定">⚙️</button>
      <button class="btn-new" onclick="newBoard()">＋ 新しいボード</button>
    </div>
  </div>
  <div class="boards-grid" id="boardsGrid"></div>
</div>

<!-- ===== EDITOR ===== -->
<div id="editorScreen" class="screen hidden">
  <div class="toolbar" id="toolbar">
    <button class="tb-back" onclick="goHome()">← 戻る</button>
    <input class="board-title-input" id="boardTitle" placeholder="ボード名">
    <div class="tb-sep"></div>

    <!-- ツール -->
    <div class="tb-group">
      <!-- ペン -->
      <button class="tb-btn active" id="toolPen" onclick="setTool('pen')" title="ペン(P)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
      <!-- テキスト -->
      <button class="tb-btn" id="toolText" onclick="setTool('text')" title="テキスト(T)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
      </button>
      <!-- 図形 -->
      <button class="tb-btn" id="toolShape" onclick="toggleShapePopup()" title="図形">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
      </button>
      <!-- 選択 -->
      <button class="tb-btn" id="toolSelect" onclick="setTool('select')" title="選択(S)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 3l14 9-7 1-3 7z"/>
        </svg>
      </button>
    </div>

    <div class="tb-sep"></div>
    <div class="tb-group color-dots" id="colorPicker"></div>
    <div class="tb-sep"></div>
    <input type="range" class="stroke-slider" id="strokeSize" min="1" max="30" value="4" title="線の太さ">
    <div class="tb-sep"></div>

    <div class="tb-group">
      <!-- テキストスタイル -->
      <button class="tb-btn" id="btnTextStyle" onclick="toggleTextStylePanel()" title="テキストスタイル">🎨</button>

      <!-- 選択オブジェクト削除（ゴミ箱） -->
      <button class="tb-btn danger" id="btnDeleteObj" onclick="deleteSelected()" title="選択を削除(Delete)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>

      <!-- Undo -->
      <button class="tb-btn" onclick="undo()" title="元に戻す(Ctrl+Z)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7v6h6"/>
          <path d="M3 13C4.3 7.2 9.7 3 16 3a9 9 0 110 18 9.3 9.3 0 01-7.5-3.8"/>
        </svg>
      </button>
      <!-- Redo -->
      <button class="tb-btn" onclick="redo()" title="やり直し(Ctrl+Y)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 7v6h-6"/>
          <path d="M21 13c-1.3-5.8-6.7-10-13-10a9 9 0 100 18 9.3 9.3 0 007.5-3.8"/>
        </svg>
      </button>
      <!-- 保存 -->
      <button class="tb-btn" onclick="saveBoard(true)" title="保存(Ctrl+S)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
      </button>
      <!-- 全消去 -->
      <button class="tb-btn" onclick="clearBoard()" title="全消去">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 20H7L3 16l11-11 6 6-1.5 1.5"/>
          <path d="M6 11l7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 図形選択ポップアップ -->
  <div class="shape-popup hidden" id="shapePopup">
    <div class="shape-opt" onclick="selectShape('rect')" title="四角形">▭</div>
    <div class="shape-opt" onclick="selectShape('circle')" title="楕円">○</div>
    <div class="shape-opt" onclick="selectShape('line')" title="直線">╱</div>
    <div class="shape-opt" onclick="selectShape('arrow')" title="矢印">→</div>
    <div class="shape-opt" onclick="selectShape('triangle')" title="三角形">△</div>
  </div>

  <!-- テキストスタイルパネル -->
  <div class="text-style-panel hidden" id="textStylePanel">
    <div class="tsp-row"><span class="tsp-label">文字色</span><div class="tsp-colors" id="tspTextColor"></div></div>
    <div class="tsp-row"><span class="tsp-label">枠の色</span><div class="tsp-colors" id="tspBorderColor"></div></div>
    <div class="tsp-row"><span class="tsp-label">背景色</span><div class="tsp-colors" id="tspBgColor"></div></div>
    <div class="tsp-row">
      <span class="tsp-label">背景透明度</span>
      <input type="range" class="tsp-slider" id="tspBgOpacity" min="0" max="100" value="90">
      <span class="tsp-val" id="tspBgOpacityVal">90%</span>
    </div>
    <div class="tsp-row">
      <span class="tsp-label">枠の太さ</span>
      <input type="range" class="tsp-slider" id="tspBorderWidth" min="0" max="8" value="2">
      <span class="tsp-val" id="tspBorderWidthVal">2px</span>
    </div>
    <div class="tsp-row">
      <span class="tsp-label">文字サイズ</span>
      <input type="range" class="tsp-slider" id="tspFontSize" min="10" max="72" value="18">
      <span class="tsp-val" id="tspFontSizeVal">18px</span>
    </div>
    <div class="tsp-row">
      <span class="tsp-label">フォント</span>
      <select class="tsp-select" id="tspFontFamily">
        <option value="-apple-system,BlinkMacSystemFont,sans-serif">システム</option>
        <option value="'Helvetica Neue',Arial,sans-serif">Helvetica</option>
        <option value="Georgia,'Times New Roman',serif">Georgia（明朝）</option>
        <option value="'Courier New',Courier,monospace">Courier（等幅）</option>
        <option value="'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif">ヒラギノ角ゴ</option>
      </select>
    </div>
    <button class="tsp-close" onclick="closeTextStylePanel()">✕ 閉じる</button>
  </div>

  <!-- キャンバス領域 -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="mainCanvas"></canvas>
    <div class="mode-badge" id="modeBadge">ペン</div>
  </div>
</div>

<!-- ローディング -->
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-spinner"></div>
</div>
<!-- トースト通知 -->
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ==============================================
   FreePad — 完全版
   修正点:
   ① 設定済み(URLハッシュあり)なら初期設定画面をスキップ
   ② 選択削除ボタン(ゴミ箱)の確実な動作
   ③ iPad Edgeでのダブルタップ検出改善
   ④ GitHub API SHA不一致(409)エラー対策強化
   ⑤ Unicode対応Base64 (TextEncoder/Decoder)
   ⑥ IME/ハードウェアキーボード対応改善
   ============================================== */

// ─── Unicode対応 Base64 ───────────────────────
function encodeBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function decodeBase64(b64) {
  const bin = atob(b64.replace(/[\n\r]/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// ─── URLハッシュ設定管理 ──────────────────────
let cfg = {};

function parseHash() {
  const map = {};
  const hash = location.hash.slice(1);
  if (!hash) return map;
  hash.split('&').forEach(pair => {
    const idx = pair.indexOf('=');
    if (idx < 0) return;
    const k = pair.slice(0, idx);
    const v = decodeURIComponent(pair.slice(idx + 1));
    map[k] = v;
  });
  return map;
}

function buildHashUrl(owner, repo, token) {
  const base = location.href.split('#')[0];
  return `${base}#owner=${encodeURIComponent(owner)}&repo=${encodeURIComponent(repo)}&token=${encodeURIComponent(token)}`;
}

// ハッシュからcfgをロード。揃っていればtrueを返す
function loadConfig() {
  const p = parseHash();
  if (p.owner && p.repo && p.token) {
    cfg = p;
    return true;
  }
  return false;
}

// ─── GitHub API ───────────────────────────────
const GH        = 'https://api.github.com';
const DATA_PATH = 'data/boards.json';
let   fileSHA   = null;  // 最後にGETで取得したSHA

function ghHeaders() {
  return {
    'Authorization':        `Bearer ${cfg.token}`,
    'Accept':               'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

// GETは毎回 cache:'no-store' で最新SHAを取得
async function ghGetFile(path) {
  const res = await fetch(
    `${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${path}`,
    { headers: ghHeaders(), cache: 'no-store' }
  );
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GET ${res.status} ${res.statusText}`);
  return res.json();
}

// PUT: 409時は最新SHAを再取得してリトライ(最大3回)
async function ghPutFile(path, contentObj, message) {
  const b64 = encodeBase64(JSON.stringify(contentObj, null, 2));

  for (let attempt = 1; attempt <= 3; attempt++) {
    // PUTの直前に毎回最新SHAを取得
    try {
      const cur = await ghGetFile(path);
      fileSHA = cur ? cur.sha : null;
    } catch (_) { /* GETが失敗しても1回試みる */ }

    const body = {
      message,
      content: b64,
      committer: { name: 'FreePad', email: 'freepad@app.local' }
    };
    if (fileSHA) body.sha = fileSHA;

    const res = await fetch(
      `${GH}/repos/${cfg.owner}/${cfg.repo}/contents/${path}`,
      {
        method: 'PUT',
        headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }
    );

    if (res.ok) {
      const data = await res.json();
      fileSHA = data.content.sha;  // 次回PUT用にSHAを更新
      return data;
    }

    const errBody = await res.json().catch(() => ({}));

    if (res.status === 409) {
      console.warn(`FreePad: SHA mismatch attempt=${attempt}, retrying...`);
      await sleep(700 * attempt);
      continue;
    }

    throw new Error(errBody.message || `PUT ${res.status}`);
  }
  throw new Error('保存に3回失敗しました。ページを再読み込みして再試行してください。');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function loadBoardsFromGitHub() {
  setSyncStatus('loading', '同期中...');
  try {
    const file = await ghGetFile(DATA_PATH);
    if (!file) {
      fileSHA = null;
      boards  = [];
    } else {
      fileSHA = file.sha;
      boards  = JSON.parse(decodeBase64(file.content));
    }
    setSyncStatus('ok', '同期済み');
  } catch (e) {
    setSyncStatus('error', 'エラー');
    showToast('⚠️ 読み込み失敗: ' + e.message, 'error');
  }
}

async function saveBoardsToGitHub() {
  setSyncStatus('loading', '保存中...');
  try {
    await ghPutFile(DATA_PATH, boards, `FreePad ${new Date().toISOString()}`);
    setSyncStatus('ok', '同期済み');
    return true;
  } catch (e) {
    setSyncStatus('error', 'エラー');
    showToast('⚠️ ' + e.message, 'error');
    return false;
  }
}

        'Accept': 'application/vnd.github+json'

    .then(() => showToast('📋 コピーしました', 'success'))
    .catch(() => {
      // clipboardが使えない場合のフォールバック
      const ta = document.createElement('textarea');
      ta.value = verifiedUrl;
      ta.style.position = 'fixed';
      ta.style.opacity  = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      ta.remove();
      showToast('📋 コピーしました', 'success');
    });

function renderHome() {

  grid.innerHTML = '';

  if (!boards.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <p style="font-size:48px;margin-bottom:12px">📋</p>
        <p>「新しいボード」から始めましょう</p>
      </div>`;
    return;
  }

  boards.slice().reverse().forEach(b => {
    const card  = document.createElement('div');
    card.className = 'board-card';

    // サムネイル
    const thumb = document.createElement('canvas');
    thumb.className = 'board-thumb';
    thumb.width  = 360;
    thumb.height = 270;
    if (b.thumb) {
      const img  = new Image();
      img.onload = () => {
        const c = thumb.getContext('2d');
        c.drawImage(img, 0, 0, 360, 270);
      };
      img.src = b.thumb;
    } else {
      const c = thumb.getContext('2d');
      c.fillStyle = '#f5f4ef';
      c.fillRect(0, 0, 360, 270);
    }

    // 情報
    const info = document.createElement('div');
    info.className  = 'board-info';
    info.innerHTML  = `
      <div class="board-name">${esc(b.name)}</div>
      <div class="board-date">${fmtDate(b.date)}</div>`;

    // 削除ボタン
    const del = document.createElement('button');
    del.className   = 'board-del';
    del.textContent = '✕';
    del.title       = '削除';
    del.onclick = e => { e.stopPropagation(); deleteBoard(b.id); };

    card.appendChild(thumb);
    card.appendChild(info);
    card.appendChild(del);
    card.onclick = () => openBoard(b.id);
    grid.appendChild(card);
  });
}

function esc(s) {
  return (s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

// ─── Canvas ────────────────────────────────────
function resizeCanvas() {
  const rect = wrap.getBoundingClientRect();
  const dpr  = window.devicePixelRatio || 1;
  canvas.width        = rect.width  * dpr;
  canvas.height       = rect.height * dpr;
  canvas.style.width  = rect.width  + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
  redraw();
}
window.addEventListener('resize', () => { resizeCanvas(); updateSelBox(); });

function redraw() {
  if (!ctx) return;
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.width  / dpr;
  const H   = canvas.height / dpr;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f5f4ef';
  ctx.fillRect(0, 0, W, H);
  drawGrid(W, H);
  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(scale, scale);
  textItems.forEach(t => drawTextItem(t));
  strokes.forEach(s => drawStroke(s));
  if (currentStroke) drawStroke(currentStroke);
  if (shapePreview)  drawShapePreview();
  ctx.restore();
}

function drawGrid(W, H) {
  const sp = 24 * scale;
  const ox = ((panX % sp) + sp) % sp;
  const oy = ((panY % sp) + sp) % sp;
  ctx.fillStyle = 'rgba(0,0,0,.06)';
  for (let x = ox; x < W; x += sp)
    for (let y = oy; y < H; y += sp) {
      ctx.beginPath();
      ctx.arc(x, y, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
}

function drawTextItem(t) {
  const x = t.x, y = t.y, w = t.w || 200, h = t.h || 80;
  const rgb   = hexToRgb(t.bgColor || '#ffffff');
  const alpha = (t.bgOpacity ?? 90) / 100;
  ctx.fillStyle = `rgba(${rgb.r},${rgb.g},${rgb.b},${alpha})`;
  ctx.beginPath(); roundRect(ctx, x, y, w, h, 8); ctx.fill();
  const bw = t.borderWidth ?? 2;
  if (bw > 0 && t.borderColor && t.borderColor !== 'transparent') {
    ctx.strokeStyle = t.borderColor;
    ctx.lineWidth   = bw;
    ctx.beginPath(); roundRect(ctx, x, y, w, h, 8); ctx.stroke();
  }
  const ff = t.fontFamily || '-apple-system,BlinkMacSystemFont,sans-serif';
  const fs = t.fontSize   || 18;
  ctx.fillStyle    = t.textColor || '#1c1c1e';
  ctx.font         = `${fs}px ${ff}`;
  ctx.textBaseline = 'top';
  wrapText(ctx, t.text || '', x + 10, y + 8, w - 20, fs * 1.5);
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  text.split('\n').forEach(line => {
    const words = line.split(' ');
    let cur = '';
    words.forEach(word => {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && cur) {
        ctx.fillText(cur, x, y); cur = word; y += lineH;
      } else { cur = test; }
    });
    ctx.fillText(cur, x, y); y += lineH;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);      ctx.arcTo(x + w, y,   x + w, y + r,   r);
  ctx.lineTo(x + w, y + h - r);  ctx.arcTo(x + w, y+h, x+w-r, y + h,   r);
  ctx.lineTo(x + r, y + h);      ctx.arcTo(x,     y+h, x,     y+h-r,   r);
  ctx.lineTo(x,     y + r);      ctx.arcTo(x,     y,   x + r, y,        r);
  ctx.closePath();
}

function drawStroke(s) {
  if (!s.points || s.points.length < 2) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = s.color || '#1c1c1e';
  ctx.lineWidth   = s.size  || 4;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  if (s.shape && s.shape !== 'pen') { drawShape(s); return; }
  ctx.beginPath();
  ctx.moveTo(s.points[0].x, s.points[0].y);
  for (let i = 1; i < s.points.length; i++) {
    const p0 = s.points[i - 1], p1 = s.points[i];
    ctx.quadraticCurveTo(p0.x, p0.y, (p0.x+p1.x)/2, (p0.y+p1.y)/2);
  }
  ctx.stroke();
}

function drawShape(s) {
  const pts = s.points;
  const x1 = pts[0].x, y1 = pts[0].y;
  const x2 = pts[pts.length-1].x, y2 = pts[pts.length-1].y;
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = s.color; ctx.lineWidth = s.size; ctx.lineCap = 'round';
  switch (s.shape) {
    case 'rect':
      ctx.strokeRect(x1, y1, x2-x1, y2-y1); break;
    case 'circle': {
      const rx = (x2-x1)/2, ry = (y2-y1)/2;
      ctx.beginPath();
      ctx.ellipse(x1+rx, y1+ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI*2);
      ctx.stroke(); break;
    }
    case 'line':
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); break;
    case 'arrow':
      drawArrow(x1, y1, x2, y2, s.size); break;
    case 'triangle':
      ctx.beginPath();
      ctx.moveTo((x1+x2)/2, y1); ctx.lineTo(x2, y2); ctx.lineTo(x1, y2);
      ctx.closePath(); ctx.stroke(); break;
  }
}
function drawArrow(x1, y1, x2, y2, lw) {
  const angle = Math.atan2(y2-y1, x2-x1);
  const hl    = Math.max(lw * 4, 16);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hl*Math.cos(angle - Math.PI/7), y2 - hl*Math.sin(angle - Math.PI/7));
  ctx.lineTo(x2 - hl*Math.cos(angle + Math.PI/7), y2 - hl*Math.sin(angle + Math.PI/7));
  ctx.closePath();
  ctx.fillStyle = ctx.strokeStyle; ctx.fill();
}
function drawShapePreview() {
  ctx.setLineDash([6, 4]);
  drawShape({
    color: currentColor, size: strokeSize / scale, shape: selectedShape,
    points: [{ x: shapePreview.x1, y: shapePreview.y1 },
             { x: shapePreview.x2, y: shapePreview.y2 }]
  });
  ctx.setLineDash([]);
}

// ─── 選択ボックス ──────────────────────────────
function clearSelection() {
  selectedId = null; selectedType = null;
  dragMode = null;   moveDragActive = false;
  if (selBox) { selBox.remove(); selBox = null; }
  handles.forEach(h => h.remove());
  handles = [];
  updateDeleteBtn();
}

function getObjectBounds(id, type) {
  if (type === 'text') {
    const t = textItems.find(x => x.id === id);
    if (!t) return null;
    return { x: t.x, y: t.y, w: t.w || 200, h: t.h || 80 };
  }
  if (type === 'stroke') {
    const s = strokes.find(x => x.id === id);
    if (!s || !s.points || !s.points.length) return null;
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    s.points.forEach(p => {
      minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
    });
    const pad = (s.size || 4) / 2;
    return { x: minX-pad, y: minY-pad, w: maxX-minX+pad*2, h: maxY-minY+pad*2 };
  }
  return null;
}

function showSelBox(id, type) {
  clearSelection();
  selectedId   = id;
  selectedType = type;

  selBox = document.createElement('div');
  selBox.className = 'sel-box';
  wrap.appendChild(selBox);

  ['nw','ne','se','sw'].forEach(pos => {
    const h = document.createElement('div');
    h.className  = 'sel-handle';
    h.dataset.pos = pos;
    h.style.cursor = { nw:'nw-resize', ne:'ne-resize', se:'se-resize', sw:'sw-resize' }[pos];
    wrap.appendChild(h);
    handles.push(h);
    h.addEventListener('pointerdown', onHandleDown, { passive: false });
  });

  updateSelBox();
  updateDeleteBtn();
}

function updateSelBox() {
  if (!selectedId || !selBox) return;
  const b = getObjectBounds(selectedId, selectedType);
  if (!b) return;
  const sx = b.x * scale + panX;
  const sy = b.y * scale + panY;
  const sw = b.w * scale;
  const sh = b.h * scale;
  selBox.style.left   = sx + 'px';
  selBox.style.top    = sy + 'px';
  selBox.style.width  = sw + 'px';
  selBox.style.height = sh + 'px';
  const pos = {
    nw: { x: sx,    y: sy    },
    ne: { x: sx+sw, y: sy    },
    se: { x: sx+sw, y: sy+sh },
    sw: { x: sx,    y: sy+sh }
  };
  handles.forEach(h => {
    const p = pos[h.dataset.pos];
    if (p) { h.style.left = p.x + 'px'; h.style.top = p.y + 'px'; }
  });
}

function onHandleDown(e) {
  e.preventDefault(); e.stopPropagation();
  dragMode = 'resize-' + e.currentTarget.dataset.pos;
  const b  = getObjectBounds(selectedId, selectedType);
  dragStart = {
    px: e.clientX, py: e.clientY,
    ox: b.x, oy: b.y, ow: b.w, oh: b.h,
    aspect: b.w / (b.h || 1)
  };
  e.currentTarget.setPointerCapture(e.pointerId);
  e.currentTarget.addEventListener('pointermove', onHandleMove, { passive: false });
  e.currentTarget.addEventListener('pointerup',   onHandleUp,   { passive: false });
}
function onHandleMove(e) {
  e.preventDefault();
  if (!dragStart) return;
  const dx = (e.clientX - dragStart.px) / scale;
  const dy = (e.clientY - dragStart.py) / scale;
  const pos = dragMode.replace('resize-', '');
  let { ox, oy, ow, oh, aspect } = dragStart;
  let nx=ox, ny=oy, nw=ow, nh=oh;
  if (pos==='se') { nw=Math.max(40,ow+dx); nh=Math.max(20,oh+dy); }
  else if (pos==='sw') { nx=ox+dx; nw=Math.max(40,ow-dx); nh=Math.max(20,oh+dy); }
  else if (pos==='ne') { nw=Math.max(40,ow+dx); ny=oy+dy; nh=Math.max(20,oh-dy); }
  else if (pos==='nw') { nx=ox+dx; ny=oy+dy; nw=Math.max(40,ow-dx); nh=Math.max(20,oh-dy); }
  if (shiftDown) { nh = nw / aspect; if (pos==='ne'||pos==='nw') ny = oy + (oh - nh); }
  applyBounds(nx, ny, nw, nh);
  updateSelBox(); redraw();
}
function onHandleUp(e) {
  e.currentTarget.removeEventListener('pointermove', onHandleMove);
  e.currentTarget.removeEventListener('pointerup',   onHandleUp);
  dragMode = null;
}
function applyBounds(x, y, w, h) {
  if (selectedType === 'text') {
    const t = textItems.find(t => t.id === selectedId);
    if (!t) return;
    t.x = x; t.y = y; t.w = w; t.h = h;
    if (floatInput && editingTextId === selectedId) posFloatInput(t);
  } else if (selectedType === 'stroke') {
    const s  = strokes.find(s => s.id === selectedId);
    if (!s) return;
    const b0 = getObjectBounds(selectedId, 'stroke');
    const sx = w / (b0.w || 1), sy = h / (b0.h || 1);
    s.points = s.points.map(p => ({
      x: x + (p.x - b0.x) * sx,
      y: y + (p.y - b0.y) * sy
    }));
  }
}

// ─── ヒットテスト ──────────────────────────────
function hitTest(cx, cy) {
  // テキストを優先（上に描かれているため後から追加されたものを先にチェック）
  for (let i = textItems.length - 1; i >= 0; i--) {
    const t = textItems[i];
    if (cx >= t.x && cx <= t.x + (t.w||200) &&
        cy >= t.y && cy <= t.y + (t.h||80))
      return { id: t.id, type: 'text' };
  }
  for (let i = strokes.length - 1; i >= 0; i--) {
    const s = strokes[i];
    if (!s.id) continue;
    const b = getObjectBounds(s.id, 'stroke');
    if (!b) continue;
    if (cx >= b.x && cx <= b.x + b.w &&
        cy >= b.y && cy <= b.y + b.h)
      return { id: s.id, type: 'stroke' };
  }
  return null;
}

// ─── ③ ポインターイベント ─────────────────────
function setupCanvasEvents() {
  wrap.addEventListener('pointerdown',  onPointerDown,  { passive: false });
  wrap.addEventListener('pointermove',  onPointerMove,  { passive: false });
  wrap.addEventListener('pointerup',    onPointerUp,    { passive: false });
  wrap.addEventListener('pointercancel',onPointerUp,    { passive: false });
  wrap.addEventListener('wheel',        onWheel,        { passive: false });
  // PCのダブルクリック
  wrap.addEventListener('dblclick',     onDblActivate);
  // ③ iPadのダブルタップ: touchendで時間・距離を計測
  wrap.addEventListener('touchend',     onTouchEnd,     { passive: false });
}

function onTouchEnd(e) {
  if (e.changedTouches.length !== 1) return;
  const touch = e.changedTouches[0];
  const now = Date.now();
  const dx  = touch.clientX - lastTapPos.x;
  const dy  = touch.clientY - lastTapPos.y;
  const dist = Math.hypot(dx, dy);

  if (now - lastTapTime < 350 && dist < 35) {
    // ダブルタップ確定
    e.preventDefault();
    const pos = cPosFromClient(touch.clientX, touch.clientY);
    handleDoubleTap(pos);
    lastTapTime = 0;
    lastTapPos  = { x: 0, y: 0 };
  } else {
    lastTapTime = now;
    lastTapPos  = { x: touch.clientX, y: touch.clientY };
  }
}

function onDblActivate(e) {
  handleDoubleTap(cPos(e));
}

function handleDoubleTap(pos) {
  if (tool === 'text') {
    createTextItem(pos);
    return;
  }
  if (tool === 'select') {
    const hit = hitTest(pos.x, pos.y);
    if (hit && hit.type === 'text') openTextEdit(hit.id);
  }
}

function onPointerDown(e) {
  // floatInputへのポインターはそのまま通過させる
  if (floatInput && e.target === floatInput) return;
  e.preventDefault();
  activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  const pCount = Object.keys(activePointers).length;

  if (pCount === 2) {
    // ピンチ開始
    isDrawing = false; currentStroke = null; moveDragActive = false;
    const pts = Object.values(activePointers);
    lastPinchDist = distP(pts[0], pts[1]);
    lastPanPos    = midP(pts[0], pts[1]);
    return;
  }

  closeShapePopup();
  closeTextStylePanel();

  if (editingTextId) { closeTextEdit(); return; }

  const pos = cPos(e);

  if (tool === 'select') {
    const hit = hitTest(pos.x, pos.y);
    if (hit) {
      if (hit.id !== selectedId) showSelBox(hit.id, hit.type);
      pushUndo();
      const bSave = getObjectBounds(hit.id, hit.type);
      dragMode       = 'move';
      moveDragActive = true;
      dragStart = {
        px: e.clientX, py: e.clientY,
        ox: bSave.x,   oy: bSave.y,
        pts0: hit.type === 'stroke'
          ? JSON.parse(JSON.stringify(strokes.find(s => s.id === hit.id).points))
          : null
      };
    } else {
      clearSelection();
      redraw();
      dragMode   = 'pan';
      lastPanPos = { x: e.clientX, y: e.clientY };
    }
    return;
  }

  if (tool === 'text') return; // テキストはダブルタップで配置

  if (tool === 'pen') {
    pushUndo();
    isDrawing = true;
    const id = 's' + Date.now() + Math.random().toString(36).slice(2);
    currentStroke = {
      id, type: 'pen', color: currentColor,
      size: strokeSize / scale, shape: 'pen', points: [pos]
    };
  }

  if (tool === 'shape') {
    pushUndo();
    isDrawing    = true;
    shapeStart   = pos;
    shapePreview = { x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y };
  }
}

function onPointerMove(e) {
  if (floatInput && e.target === floatInput) return;
  e.preventDefault();
  activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  const pCount = Object.keys(activePointers).length;

  if (pCount === 2) {
    const pts = Object.values(activePointers);
    const d   = distP(pts[0], pts[1]);
    const m   = midP(pts[0], pts[1]);
    if (lastPinchDist !== null) {
      const f    = d / lastPinchDist;
      const rect = wrap.getBoundingClientRect();
      const mx   = m.x - rect.left, my = m.y - rect.top;
      panX  = mx - (mx - panX) * f;
      panY  = my - (my - panY) * f;
      scale = Math.max(0.2, Math.min(5, scale * f));
    }
    if (lastPanPos) {
      panX += m.x - lastPanPos.x;
      panY += m.y - lastPanPos.y;
    }
    lastPinchDist = d; lastPanPos = m;
    redraw(); updateSelBox();
    return;
  }

  if (dragMode === 'pan') {
    panX += e.clientX - lastPanPos.x;
    panY += e.clientY - lastPanPos.y;
    lastPanPos = { x: e.clientX, y: e.clientY };
    redraw(); updateSelBox();
    return;
  }

  if (dragMode === 'move' && moveDragActive) {
    const dx = (e.clientX - dragStart.px) / scale;
    const dy = (e.clientY - dragStart.py) / scale;
    if (selectedType === 'text') {
      const t = textItems.find(t => t.id === selectedId);
      if (t) {
        t.x = dragStart.ox + dx; t.y = dragStart.oy + dy;
        if (floatInput && editingTextId === selectedId) posFloatInput(t);
      }
    } else if (selectedType === 'stroke') {
      const s = strokes.find(s => s.id === selectedId);
      if (s && dragStart.pts0)
        s.points = dragStart.pts0.map(p => ({ x: p.x+dx, y: p.y+dy }));
    }
    updateSelBox(); redraw();
    return;
  }

  if (!isDrawing) return;
  const pos = cPos(e);
  if (tool === 'pen')   { currentStroke.points.push(pos); redraw(); }
  if (tool === 'shape') { shapePreview.x2 = pos.x; shapePreview.y2 = pos.y; redraw(); }
}

function onPointerUp(e) {
  if (floatInput && e.target === floatInput) return;
  e.preventDefault();
  delete activePointers[e.pointerId];
  const pCount = Object.keys(activePointers).length;
  if (pCount < 2) { lastPinchDist = null; lastPanPos = null; }

  if (dragMode === 'pan')  { dragMode = null; return; }
  if (dragMode === 'move') { moveDragActive = false; dragMode = null; updateSelBox(); return; }
  if (!isDrawing) return;
  isDrawing = false;

  if (tool === 'pen') {
    if (currentStroke && currentStroke.points.length >= 2)
      strokes.push(currentStroke);
    currentStroke = null;
  }
  if (tool === 'shape' && shapePreview) {
    if (Math.abs(shapePreview.x2 - shapePreview.x1) > 3 ||
        Math.abs(shapePreview.y2 - shapePreview.y1) > 3) {
      const id = 's' + Date.now() + Math.random().toString(36).slice(2);
      strokes.push({
        id, type: 'shape', color: currentColor,
        size: strokeSize / scale, shape: selectedShape,
        points: [{ x: shapePreview.x1, y: shapePreview.y1 },
                 { x: shapePreview.x2, y: shapePreview.y2 }]
      });
    }
    shapePreview = null; shapeStart = null;
  }
  redraw();
}

function onWheel(e) {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mx   = e.clientX - rect.left;
  const my   = e.clientY - rect.top;
  const f    = e.deltaY < 0 ? 1.1 : 0.9;
  panX  = mx - (mx - panX) * f;
  panY  = my - (my - panY) * f;
  scale = Math.max(0.2, Math.min(5, scale * f));
  redraw(); updateSelBox();
}

function cPos(e)                  { return cPosFromClient(e.clientX, e.clientY); }
function cPosFromClient(cx, cy)   {
  const r = wrap.getBoundingClientRect();
  return { x: (cx - r.left - panX) / scale, y: (cy - r.top  - panY) / scale };
}
function distP(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function midP(a, b)  { return { x: (a.x+b.x)/2, y: (a.y+b.y)/2 }; }

// ─── テキストアイテム ──────────────────────────
function createTextItem(pos) {
  pushUndo();
  const id = 't' + Date.now() + Math.random().toString(36).slice(2);
  const item = {
    id, x: pos.x, y: pos.y, w: 200, h: 80, text: '',
    textColor:   tspTextColor,
    borderColor: tspBorderColor,
    bgColor:     tspBgColor,
    bgOpacity:   tspBgOpacity,
    borderWidth: tspBorderWidth,
    fontSize:    tspFontSize,
    fontFamily:  tspFontFamily
  };
  textItems.push(item);
  redraw();
  openTextEdit(id);
}

function openTextEdit(id) {
  closeTextEdit();
  const t = textItems.find(x => x.id === id);
  if (!t) return;
  editingTextId = id;

  floatInput = document.createElement('textarea');
  floatInput.className = 'float-textarea';
  floatInput.value     = t.text || '';
  floatInput.style.color      = t.textColor   || '#1c1c1e';
  floatInput.style.caretColor = t.textColor   || '#1c1c1e';
  floatInput.style.fontFamily = t.fontFamily  || '-apple-system,sans-serif';
  floatInput.setAttribute('autocomplete', 'off');
  floatInput.setAttribute('autocorrect',  'off');
  floatInput.setAttribute('autocapitalize', 'none');
  floatInput.setAttribute('spellcheck',   'false');

  posFloatInput(t);
  wrap.appendChild(floatInput);

  isComposing = false;

  // ⑥ IME/ハードウェアキーボード対応
  floatInput.addEventListener('compositionstart', () => { isComposing = true; });
  floatInput.addEventListener('compositionend',   () => {
    isComposing  = false;
    t.text = floatInput.value;
    autoGrow(t); redraw(); updateSelBox();
  });
  floatInput.addEventListener('input', () => {
    // compositionend前にinputが来る場合があるので両方でtextを更新
    t.text = floatInput.value;
    autoGrow(t); redraw(); updateSelBox();
  });
  floatInput.addEventListener('keydown', e => {
    if (isComposing) return;
    if (e.key === 'Escape') { e.preventDefault(); closeTextEdit(); }
    // Enterは改行として通過させる（stopしない）
  });
  // タッチ/ポインターイベントがキャンバスに届かないようstopPropagation
  // ただしpreventDefaultはしない（IMEが壊れる）
  ['pointerdown','pointermove','pointerup',
   'touchstart','touchmove','touchend'].forEach(ev => {
    floatInput.addEventListener(ev, e => e.stopPropagation(), { passive: true });
  });
  floatInput.addEventListener('blur', () => {
    if (!isComposing) {
      // blurしても即closeせず少し待つ（セレクト変更時の誤closeを防ぐ）
      setTimeout(() => {
        if (editingTextId && !isComposing) closeTextEdit();
      }, 200);
    }
  });

  showSelBox(id, 'text');
  setTimeout(() => { if (floatInput) floatInput.focus(); }, 80);
}

function autoGrow(t) {
  if (!floatInput) return;
  const lines = (t.text || '').split('\n').length;
  const lh    = (t.fontSize || 18) * 1.6;
  t.h = Math.max(80, lines * lh + 20);
  floatInput.style.height = (t.h * scale) + 'px';
}
function posFloatInput(t) {
  if (!floatInput) return;
  floatInput.style.left     = (t.x * scale + panX) + 'px';
  floatInput.style.top      = (t.y * scale + panY) + 'px';
  floatInput.style.width    = ((t.w || 200) * scale) + 'px';
  floatInput.style.height   = ((t.h || 80)  * scale) + 'px';
  floatInput.style.fontSize = ((t.fontSize || 18) * scale) + 'px';
}
function closeTextEdit() {
  if (floatInput) { floatInput.remove(); floatInput = null; }
  editingTextId = null;
  isComposing   = false;
  redraw();
}

// ─── テキストスタイルパネル ────────────────────
function buildTextStylePanel() {
  buildTspColors('tspTextColor',   COLORS,
    () => tspTextColor,
    v  => { tspTextColor = v; applyStyleToSelected('textColor', v); });
  buildTspColors('tspBorderColor', [...COLORS, 'transparent'],
    () => tspBorderColor,
    v  => { tspBorderColor = v; applyStyleToSelected('borderColor', v); });
  buildTspColors('tspBgColor',     [...COLORS, 'transparent'],
    () => tspBgColor,
    v  => { tspBgColor = v; applyStyleToSelected('bgColor', v); });

  const bind = (id, valId, unit, key, setter) => {
    const el  = document.getElementById(id);
    const vEl = document.getElementById(valId);
    el.addEventListener('input', () => {
      const v = +el.value;
      setter(v);
      vEl.textContent = v + unit;
      applyStyleToSelected(key, v);
      if (key === 'fontSize' && floatInput)
        floatInput.style.fontSize = (v * scale) + 'px';
    });
  };
  bind('tspBgOpacity',   'tspBgOpacityVal',   '%',  'bgOpacity',   v => tspBgOpacity   = v);
  bind('tspBorderWidth', 'tspBorderWidthVal', 'px', 'borderWidth', v => tspBorderWidth = v);
  bind('tspFontSize',    'tspFontSizeVal',    'px', 'fontSize',    v => tspFontSize    = v);

  const ffEl = document.getElementById('tspFontFamily');
  ffEl.addEventListener('change', () => {
    tspFontFamily = ffEl.value;
    applyStyleToSelected('fontFamily', tspFontFamily);
    if (floatInput) floatInput.style.fontFamily = tspFontFamily;
    redraw();
  });
}

function buildTspColors(elId, colors, getVal, setVal) {
  const el = document.getElementById(elId);
  colors.forEach(c => {
    const d = document.createElement('div');
    d.className = 'tsp-dot';
    if (c === 'transparent') {
      d.style.background = 'linear-gradient(135deg,#fff 45%,#f00 45%,#f00 55%,#fff 55%)';
      d.style.border = '2px solid #ccc';
      d.title = '透明';
    } else {
      d.style.background = c;
      if (c === '#ffffff') d.style.border = '2px solid #ccc';
    }
    d.onclick = () => {
      el.querySelectorAll('.tsp-dot').forEach(x => x.classList.remove('active'));
      d.classList.add('active');
      setVal(c); redraw();
    };
    if (c === getVal()) d.classList.add('active');
    el.appendChild(d);
  });
}

function applyStyleToSelected(key, val) {
  if (selectedType === 'text') {
    const t = textItems.find(t => t.id === selectedId);
    if (t) { t[key] = val; redraw(); }
  }
}
function toggleTextStylePanel() {
  document.getElementById('textStylePanel').classList.toggle('hidden');
}
function closeTextStylePanel() {
  document.getElementById('textStylePanel').classList.add('hidden');
}

// ─── ツール切替 ────────────────────────────────
function setTool(t) {
  if (t !== 'select') clearSelection();
  tool = t;
  ['Pen','Text','Shape','Select'].forEach(n => {
    const btn = document.getElementById('tool' + n);
    if (btn) btn.classList.toggle('active', n.toLowerCase() === t);
  });
  const badges = {
    pen:    'ペン',
    text:   'テキスト（ダブルタップで配置）',
    shape:  '図形（ドラッグで描画）',
    select: '選択・移動・拡大縮小（SHIFTで比率固定）'
  };
  document.getElementById('modeBadge').textContent = badges[t] || t;
  canvas.classList.toggle('select-mode', t === 'select');
  closeShapePopup();
  closeTextStylePanel();
}
function toggleShapePopup() {
  document.getElementById('shapePopup').classList.toggle('hidden');
}
function closeShapePopup() {
  document.getElementById('shapePopup').classList.add('hidden');
}
function selectShape(s) {
  selectedShape = s;
  setTool('shape');
  document.getElementById('toolShape').classList.add('active');
  closeShapePopup();
}

// ─── Undo / Redo ───────────────────────────────
function getState() {
  return {
    strokes:   JSON.parse(JSON.stringify(strokes)),
    texts:     JSON.parse(JSON.stringify(textItems))
  };
}
function applyState(s) {
  strokes   = s.strokes;
  textItems = s.texts;
  clearSelection();
  closeTextEdit();
  redraw();
}
function pushUndo() {
  undoStack.push(getState());
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
}
function undo() { if (!undoStack.length) return; redoStack.push(getState()); applyState(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(getState()); applyState(redoStack.pop()); }

// ─── カラーピッカー ────────────────────────────
function buildColorPicker() {
  const cp = document.getElementById('colorPicker');
  COLORS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'color-dot' + (c === currentColor ? ' active' : '');
    d.style.background = c;
    if (c === '#ffffff') d.style.border = '3px solid #ccc';
    d.onclick = () => {
      document.querySelectorAll('#colorPicker .color-dot').forEach(x => x.classList.remove('active'));
      d.classList.add('active');
      currentColor = c;
    };
    cp.appendChild(d);
  });
}

// ─── キーボード ────────────────────────────────
function setupKeyboard() {
  document.addEventListener('keydown', e => {
    shiftDown = e.shiftKey;
    if (isComposing) return;
    if (document.getElementById('editorScreen').classList.contains('hidden')) return;

    const tag = document.activeElement ? document.activeElement.tagName : '';

    // テキストエリアやインプット内では最低限だけ処理
    if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault(); saveBoard(true);
      }
      return;
    }

    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); redo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveBoard(true); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
      e.preventDefault(); deleteSelected(); return;
    }
    if (e.key === 'p') { setTool('pen');    return; }
    if (e.key === 't') { setTool('text');   return; }
    if (e.key === 's' && !e.ctrlKey && !e.metaKey) { setTool('select'); return; }
    if (e.key === 'Escape') {
      clearSelection(); closeTextEdit();
      closeShapePopup(); closeTextStylePanel();
      redraw();
    }
  });
  document.addEventListener('keyup', e => { shiftDown = e.shiftKey; });
}

// ─── ユーティリティ ────────────────────────────
function hexToRgb(hex) {
  if (!hex || hex === 'transparent') return { r:255, g:255, b:255 };
  return {
    r: parseInt(hex.slice(1,3), 16),
    g: parseInt(hex.slice(3,5), 16),
    b: parseInt(hex.slice(5,7), 16)
  };
}
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden');    }
function showLoading(v) {
  document.getElementById('loadingOverlay').classList.toggle('hidden', !v);
}
let toastTimer = null;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast ' + type + ' show';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
function setSyncStatus(state, label) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  if (!dot) return;
  dot.className = 'sync-dot' +
    (state === 'loading' ? ' loading' : state === 'error' ? ' error' : '');
  if (lbl) lbl.textContent = label;
}
</script>
</body>
